workflow:
  rules:
    # Support GitHub pull requests through GitLab's external-repository
    # integration, as well as native GitLab merge requests and manual runs.
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - cache
  - object-performance
  - publish

variables:
  # These public group-area samples follow the V50nano_170 baseline. Override a
  # path when starting a pipeline, or set it to an empty string to skip that
  # sample and its dependent plots.
  JET_NANO_GLOB: "root://eoscms.cern.ch//eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/roward/phase2/menu/ntuples/Spring24/170/v45/TT_TuneCP5_14TeV-powheg-pythia8/TT_Spring24_200PU_V45_reL1wTT_170/*/hadd/*.root"
  TAU_NANO_GLOB: "root://eoscms.cern.ch//eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/roward/phase2/menu/ntuples/Spring24/170/v45/VBF_HToTauTau_M-125_TuneCP5_14TeV-powheg-pythia8/VBFHtoTaus_Spring24_200PU_V45_reL1wTT_170/*/hadd/*.root"
  DY_NANO_GLOB: "root://eoscms.cern.ch//eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/roward/phase2/menu/ntuples/Spring24/170/v45/DYToLL_M-50_TuneCP5_14TeV-pythia8/DY_M50_Spring24_200PU_V45_reL1wTT_170/*/hadd/*.root"
  PHOTON_NANO_GLOB: "root://eoscms.cern.ch//eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/roward/phase2/menu/ntuples/Spring24/170/v45/GluGluHToGG_M-125_TuneCP5_14TeV-powheg-pythia8/Hto2gg_Spring24_200PU_V45_reL1wTT_170/*/hadd/*.root"
  PUBLISH_EOS_BASE: "/eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/cmsl1dpg/MenuTools"
  MPLBACKEND: "Agg"
  LCG_VIEW: "/cvmfs/sft.cern.ch/lcg/views/LCG_106/x86_64-el8-gcc11-opt"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

default:
  image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker/al8-cms:latest
  tags: [k8s-cvmfs]
  interruptible: true

  cache:
    key: "python-3.11-${CI_PROJECT_NAME}"
    paths:
      - .cache/pip/

  before_script:
    # GitLab runs the container as an unprivileged user. Use the Python 3.11
    # installation from the mounted CERN LCG view to create a local environment.
    - source "${LCG_VIEW}/setup.sh"
    - python3.11 -m venv .venv
    - source .venv/bin/activate
    - unset PYTHONPATH
    - python -m pip install --editable .

.cache_sample:
  stage: cache
  # Keep a failed sample visible, but let unrelated sample groups complete and
  # leave the partial publish job available.
  allow_failure: true
  timeout: 2h

  before_script:
    # Cache jobs also need an authenticated CERN EOS session.
    - source "${LCG_VIEW}/setup.sh"
    - python3.11 -m venv .venv
    - source .venv/bin/activate
    # Keep the LCG runtime libraries, but use the Python packages installed in
    # this job's virtual environment.
    - unset PYTHONPATH
    - python -m pip install --editable . "xrootd==6.2.1" "fsspec-xrootd==0.2.4"
    - python -c "import pyarrow; assert pyarrow.Codec.is_available('zstd'); print(pyarrow.__file__)"
    - source /cvmfs/grid.cern.ch/etc/profile.d/setup-cvmfs-ui.sh
    - |
      if [[ -z "${AUTO_DEVOPS_CERNBOX_USER:-}" || -z "${AUTO_DEVOPS_CERNBOX_PASS:-}" ]]; then
        echo "Configure masked AUTO_DEVOPS_CERNBOX_USER and AUTO_DEVOPS_CERNBOX_PASS CI/CD variables."
        exit 1
      fi
    - printf '%s\n' "${AUTO_DEVOPS_CERNBOX_PASS}" | kinit "${AUTO_DEVOPS_CERNBOX_USER}@CERN.CH"
    - klist

  script:
    - |
      set -euo pipefail
      mkdir -p cache/V50nano_170
      configured_input="${!INPUT_VARIABLE:-}"
      echo "Checking ${SAMPLE_NAME} input from ${configured_input:-<empty>}"

      set +e
      check_input_files "${configured_input}"
      input_status=$?
      set -e

      if [[ ${input_status} -eq 3 ]]; then
        echo "No ${SAMPLE_NAME} Nano is available; its plots will be skipped."
        exit 0
      elif [[ ${input_status} -ne 0 ]]; then
        echo "Failed while checking the ${SAMPLE_NAME} Nano."
        exit "${input_status}"
      fi

      cache_objects configs/ci/pf_performance_caching.yaml --sample "${SAMPLE_NAME}"
      if [[ "${MERGE_EG}" == "true" ]]; then
        python menu_tools/caching/merge_arrays.py \
          --version V50nano_170 --sample "${SAMPLE_NAME}"
      fi
      touch "cache/V50nano_170/.${SAMPLE_NAME}.available"
      find cache/V50nano_170 -type f -print

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - cache/V50nano_170/

cache_jet_objects:
  extends: .cache_sample
  variables:
    SAMPLE_NAME: "TT"
    INPUT_VARIABLE: "JET_NANO_GLOB"
    MERGE_EG: "false"

cache_tau_objects:
  extends: .cache_sample
  variables:
    SAMPLE_NAME: "VBFHToTauTau"
    INPUT_VARIABLE: "TAU_NANO_GLOB"
    MERGE_EG: "false"

cache_dy_objects:
  extends: .cache_sample
  variables:
    SAMPLE_NAME: "DYLL_M50"
    INPUT_VARIABLE: "DY_NANO_GLOB"
    MERGE_EG: "true"

cache_photon_objects:
  extends: .cache_sample
  variables:
    SAMPLE_NAME: "Hgg"
    INPUT_VARIABLE: "PHOTON_NANO_GLOB"
    MERGE_EG: "true"

.object_performance:
  stage: object-performance
  # Plot failures remain visible as warnings without blocking other plots or
  # publication of the successful artifacts.
  allow_failure: true
  # Scaling payload names are object-based. Prefix them before upload so plots
  # for different samples cannot overwrite one another in the publish job.
  after_script:
    - |
      scaling_dir=outputs/V50nano_170/object_performance/scalings
      if [[ -d "${scaling_dir}" ]]; then
        find "${scaling_dir}" -maxdepth 1 -type f -name '*.yaml' -print0 | \
          while IFS= read -r -d '' file; do
            mv "${file}" "${scaling_dir}/${CI_JOB_NAME}_$(basename "${file}")"
          done
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - outputs/V50nano_170/object_performance/

jet_matching_efficiency:
  extends: .object_performance
  needs:
    - job: cache_jet_objects
      artifacts: true
  script:
    - |
      test -f cache/V50nano_170/.TT.available || { echo "Skipping: no TT Nano."; exit 0; }
      object_performance configs/V50nano/object_performance/jets_matching.yaml --version V50nano_170

jet_trigger_turnons:
  extends: .object_performance
  needs:
    - job: cache_jet_objects
      artifacts: true
  script:
    - |
      test -f cache/V50nano_170/.TT.available || { echo "Skipping: no TT Nano."; exit 0; }
      object_performance configs/V50nano/object_performance/jets_trigger.yaml --version V50nano_170
      object_performance configs/V50nano/object_performance/jets_sc8_trigger.yaml --version V50nano_170

event_sum_turnons:
  extends: .object_performance
  needs:
    - job: cache_jet_objects
      artifacts: true
  script:
    - |
      test -f cache/V50nano_170/.TT.available || { echo "Skipping: no TT Nano."; exit 0; }
      object_performance configs/V50nano/object_performance/met_ht_mht.yaml --version V50nano_170

