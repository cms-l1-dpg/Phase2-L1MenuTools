workflow:
  rules:
    # Support GitHub pull requests through GitLab's external-repository
    # integration, as well as native GitLab merge requests and manual runs.
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - jet-performance

variables:
  # This public group-area sample is the V44nano baseline. Override the variable
  # when starting a pipeline to validate a different compatible menu Nano.
  JET_NANO_GLOB: "/eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/roward/phase2/menu/ntuples/Spring24/142pre1/v44/TT_TuneCP5_14TeV-powheg-pythia8/TT_Spring24_200PU_V44_reL1wTT/*/0000/*.root"
  MPLBACKEND: "Agg"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

jet_matching_efficiency:
  stage: jet-performance
  image: python:3.11-slim
  tags: [k8s-cvmfs]
  interruptible: true

  # One manual action runs both the Nano-to-Parquet caching and plotting steps.
  # Keeping them in one job avoids transferring large Parquet files as artifacts.
  when: manual
  allow_failure: false

  cache:
    key: "python-3.11-${CI_PROJECT_NAME}"
    paths:
      - .cache/pip/

  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install --editable .

  script:
    - echo "Reading jet Nano input from ${JET_NANO_GLOB}"
    - cache_objects configs/ci/jets_caching.yaml
    - object_performance configs/V44nano/object_performance/jets_matching.yaml
    - find outputs/V44nano/object_performance -type f -print

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - outputs/V44nano/object_performance/
