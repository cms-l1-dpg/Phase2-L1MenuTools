workflow:
  rules:
    # Support GitHub pull requests through GitLab's external-repository
    # integration, as well as native GitLab merge requests and manual runs.
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - cache
  - object-performance
  - publish

variables:
  # These public group-area samples are the V44nano baseline. Override the
  # paths when starting a pipeline with different compatible menu Nanos.
  JET_NANO_GLOB: "root://eoscms.cern.ch//eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/roward/phase2/menu/ntuples/Spring24/142pre1/v44/TT_TuneCP5_14TeV-powheg-pythia8/TT_Spring24_200PU_V44_reL1wTT/241004_154807/hadd/output_Phase2_L1T.root"
  TAU_NANO_GLOB: "root://eoscms.cern.ch//eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/roward/phase2/menu/ntuples/Spring24/142pre1/v44/VBF_HToTauTau_M-125_TuneCP5_14TeV-powheg-pythia8/VBFHtoTaus_Spring24_200PU_V44_reL1wTT/*/0000/*.root"
  PUBLISH_EOS_BASE: "/eos/user/e/ejclemen/TPV/L1TSteamHackathon/MenuTools"
  MPLBACKEND: "Agg"
  LCG_VIEW: "/cvmfs/sft.cern.ch/lcg/views/LCG_106/x86_64-el8-gcc11-opt"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

default:
  image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker/al8-cms:latest
  tags: [k8s-cvmfs]
  interruptible: true

  cache:
    key: "python-3.11-${CI_PROJECT_NAME}"
    paths:
      - .cache/pip/

  before_script:
    # GitLab runs the container as an unprivileged user. Use the Python 3.11
    # installation from the mounted CERN LCG view to create a local environment.
    - source "${LCG_VIEW}/setup.sh"
    - python3.11 -m venv .venv
    - source .venv/bin/activate
    - unset PYTHONPATH
    - python -m pip install --editable .

cache_menu_objects:
  stage: cache
  # Reading all selected Nano branches is expensive, so start this job explicitly.
  when: manual
  allow_failure: false
  timeout: 2h

  before_script:
    # Repeat the common Python setup because this job also needs an authenticated
    # CERN EOS session; object-performance jobs only consume artifacts.
    - source "${LCG_VIEW}/setup.sh"
    - python3.11 -m venv .venv
    - source .venv/bin/activate
    # Keep the LCG runtime libraries, but do not import its Python packages over
    # the versions pinned and installed by MenuTools.
    - unset PYTHONPATH
    - python -m pip install --editable . "xrootd==6.2.1" "fsspec-xrootd==0.2.4"
    - python -c "import pyarrow; assert pyarrow.Codec.is_available('zstd'); print(pyarrow.__file__)"
    - source /cvmfs/grid.cern.ch/etc/profile.d/setup-cvmfs-ui.sh
    - |
      if [[ -z "${AUTO_DEVOPS_CERNBOX_USER:-}" || -z "${AUTO_DEVOPS_CERNBOX_PASS:-}" ]]; then
        echo "Configure masked AUTO_DEVOPS_CERNBOX_USER and AUTO_DEVOPS_CERNBOX_PASS CI/CD variables."
        exit 1
      fi
    - printf '%s\n' "${AUTO_DEVOPS_CERNBOX_PASS}" | kinit "${AUTO_DEVOPS_CERNBOX_USER}@CERN.CH"
    - klist

  script:
    # Read through CERN's internal EOS endpoint. Local filesystem paths and
    # globs remain supported for interactive use.
    - echo "Reading jet and event-sum input from ${JET_NANO_GLOB}"
    - echo "Reading tau input from ${TAU_NANO_GLOB}"
    - cache_objects configs/ci/pf_performance_caching.yaml
    - find cache/V44nano -type f -print

  # Object-performance jobs in the next stage reuse this columnar cache.
  artifacts:
    expire_in: 14 days
    paths:
      - cache/V44nano/

.object_performance:
  stage: object-performance
  needs:
    - job: cache_menu_objects
      artifacts: true
  allow_failure: false
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - outputs/V44nano/object_performance/

jet_matching_efficiency:
  extends: .object_performance
  script:
    - object_performance configs/V44nano/object_performance/jets_matching.yaml

jet_trigger_turnons:
  extends: .object_performance
  script:
    - object_performance configs/V44nano/object_performance/jets_trigger.yaml
    - object_performance configs/V44nano/object_performance/jets_sc8_trigger.yaml

event_sum_turnons:
  extends: .object_performance
  script:
    - object_performance configs/V44nano/object_performance/met_ht_mht.yaml

tau_matching_efficiency:
  extends: .object_performance
  script:
    - object_performance configs/V44nano/object_performance/tau_matching.yaml

tau_trigger_turnons:
  extends: .object_performance
  script:
    - object_performance configs/V44nano/object_performance/tau_trigger.yaml

publish_plots:
  stage: publish
  needs:
    - job: jet_matching_efficiency
      artifacts: true
    - job: jet_trigger_turnons
      artifacts: true
    - job: event_sum_turnons
      artifacts: true
    - job: tau_matching_efficiency
      artifacts: true
    - job: tau_trigger_turnons
      artifacts: true
  allow_failure: false

  before_script:
    - source /cvmfs/grid.cern.ch/etc/profile.d/setup-cvmfs-ui.sh
    - |
      if [[ -z "${AUTO_DEVOPS_CERNBOX_USER:-}" || -z "${AUTO_DEVOPS_CERNBOX_PASS:-}" ]]; then
        echo "Configure masked AUTO_DEVOPS_CERNBOX_USER and AUTO_DEVOPS_CERNBOX_PASS CI/CD variables."
        exit 1
      fi
    - printf '%s\n' "${AUTO_DEVOPS_CERNBOX_PASS}" | kinit "${AUTO_DEVOPS_CERNBOX_USER}@CERN.CH"
    - klist

  script:
    - export PUBLISH_EOS_DIR="${PUBLISH_EOS_BASE}/${CI_COMMIT_REF_SLUG}/pipeline-${CI_PIPELINE_ID}"
    - |
      printf '%s\n' \
        "project=${CI_PROJECT_PATH}" \
        "commit=${CI_COMMIT_SHA}" \
        "pipeline=${CI_PIPELINE_URL}" \
        "jet_input=${JET_NANO_GLOB}" \
        "tau_input=${TAU_NANO_GLOB}" \
        "eos_destination=${PUBLISH_EOS_DIR}" \
        > outputs/V44nano/CI_PROVENANCE.txt
    - xrdfs root://eosuser.cern.ch mkdir -p "${PUBLISH_EOS_DIR}"
    - xrdcp --force --recursive --nopbar outputs/V44nano "root://eosuser.cern.ch/${PUBLISH_EOS_DIR}/"
    - xrdfs root://eosuser.cern.ch ls -R "${PUBLISH_EOS_DIR}"
    - echo "Published plots to ${PUBLISH_EOS_DIR}"
