workflow:
  rules:
    # Support GitHub pull requests through GitLab's external-repository
    # integration, as well as native GitLab merge requests and manual runs.
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - cache
  - object-performance

variables:
  # This public group-area sample is the V44nano baseline. Override the source
  # URL when starting a pipeline to validate a different compatible menu Nano.
  JET_NANO_SOURCE: "root://eoscms.cern.ch//eos/cms/store/group/dpg_trigger/comm_trigger/L1Trigger/roward/phase2/menu/ntuples/Spring24/142pre1/v44/TT_TuneCP5_14TeV-powheg-pythia8/TT_Spring24_200PU_V44_reL1wTT/241004_154807/hadd/output_Phase2_L1T.root"
  JET_NANO_GLOB: "$CI_PROJECT_DIR/inputs/*.root"
  MPLBACKEND: "Agg"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.11-slim
  tags: [k8s-cvmfs]
  interruptible: true

  cache:
    key: "python-3.11-${CI_PROJECT_NAME}"
    paths:
      - .cache/pip/

  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install --editable .

cache_menu_objects:
  stage: cache
  # Reading all selected Nano branches is expensive, so start this job explicitly.
  when: manual
  allow_failure: false
  timeout: 2h

  script:
    # The Kubernetes runner does not expose /eos as a filesystem mount. Stage the
    # selected Nano through XRootD, then use the normal local-file cache interface.
    - source /cvmfs/grid.cern.ch/alma9-ui-test/etc/profile.d/setup-alma9-test.sh
    - mkdir -p inputs
    - echo "Staging menu Nano from ${JET_NANO_SOURCE}"
    - xrdcp --force --nopbar "${JET_NANO_SOURCE}" inputs/menu_nano.root
    - cache_objects configs/ci/jets_caching.yaml
    - find cache/V44nano -type f -print

  # Object-performance jobs in the next stage reuse this columnar cache.
  artifacts:
    expire_in: 14 days
    paths:
      - cache/V44nano/

jet_matching_efficiency:
  stage: object-performance
  needs:
    - job: cache_menu_objects
      artifacts: true
  when: manual
  allow_failure: false

  script:
    - object_performance configs/V44nano/object_performance/jets_matching.yaml
    - find outputs/V44nano/object_performance -type f -print

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - outputs/V44nano/object_performance/
