# B Jet Seeds with 
L1_PFHTT_QuadJet_BTagNNScore_Relaxed:
  cross_masks:
    - (leg2.btagScore + leg3.btagScore + leg4.btagScore + leg5.btagScore) > 0
    - abs(leg2.eta) < 2.4
    - abs(leg3.eta) < 2.4
    - abs(leg4.eta) < 2.4
    - abs(leg5.eta) < 2.4
  leg1:
    threshold_cut: offline_pt >= 299.0
    obj: L1puppiJetSC4sums:HT
  leg2:
    threshold_cut: pt >= 25
    obj: L1puppiExtJetSC4:default
  leg3:
    threshold_cut: pt >= 25
    obj: L1puppiExtJetSC4:default
  leg4:
    threshold_cut: pt >= 25
    obj: L1puppiExtJetSC4:default
  leg5:
    threshold_cut: pt >= 25
    obj: L1puppiExtJetSC4:default

L1_PFHTT_QuadJetNG_BTagNNScore:
  cross_masks:
