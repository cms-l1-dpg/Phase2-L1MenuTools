### SC8 wide cone jet seeds
L1_SinglePfJet8:
  cross_masks: []
  leg1:
    threshold_cut: offline_pt >= 230.0
    obj: L1puppiJetSC8:default

# L1_SinglePfJet8Mass27:
#   cross_masks: []
#   leg1:
#     threshold_cut: pt >= 0
#     obj: L1puppiJetSC8:mass27

L1_SinglePfJet8_Mass:
  cross_masks: []
  leg1:
    threshold_cut: pt >= 120
    obj: L1puppiJetSC8:mass20

### Double wide jet mass
L1_DoublePFJet8_dEtaMax:
  cross_masks:
    - abs(leg2.eta-leg1.eta) < 1.6
  leg1:
    threshold_cut: leg1.offline_pt >= 200.0
    obj: L1puppiJetSC8:default
  leg2:
    threshold_cut: leg2.offline_pt >= 200.0
    obj: L1puppiJetSC8:default

