  leg1:
    threshold_cut: offline_pt >= 299.0
    obj: L1puppiJetSC4sums:HT
  leg2:
    threshold_cut: pt >= 25
    obj: L1puppiJetSC4NG:default
  leg3:
    threshold_cut: pt >= 25
    obj: L1puppiJetSC4NG:default
  leg4:
    threshold_cut: pt >= 25
    obj: L1puppiJetSC4NG:default
  leg5:
    threshold_cut: pt >= 25
    obj: L1puppiJetSC4NG:default

