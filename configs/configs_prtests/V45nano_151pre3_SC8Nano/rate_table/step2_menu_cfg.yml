### SC8 wide cone jet seeds with mass cut
L1_SinglePfJet8Mass:
  cross_masks: []
  leg1:
    threshold_cut: pt >= 0
    obj: L1puppiJetSC8:mass30


L1_DoublePFJet8_dEtaMaxMass:
  cross_masks:
    - abs(leg2.eta-leg1.eta) < 1.6
  leg1:
    threshold_cut: pt >= 0
    obj: L1puppiJetSC8:mass30
  leg2:
    threshold_cut: pt >= 0
    obj: L1puppiJetSC8:mass30

### SC8 wide cone jet seeds
L1_SinglePfJet8:
  cross_masks: []
  leg1:
    threshold_cut: offline_pt >= 230.0
    obj: L1puppiJetSC8:default
L1_DoublePFJet8_dEtaMax:
  cross_masks:
    - abs(leg2.eta-leg1.eta) < 1.6
  leg1:
    threshold_cut: leg1.offline_pt >= 200.0
    obj: L1puppiJetSC8:default
  leg2:
    threshold_cut: leg2.offline_pt >= 200.0
    obj: L1puppiJetSC8:default

L1_DoublePFJet8_dEtaMax:
  cross_masks:
    - abs(leg2.eta-leg1.eta) < 1.6
  leg1:
    threshold_cut: leg1.offline_pt >= 200.0
    obj: L1puppiJetSC8:default
  leg2:
    threshold_cut: leg2.offline_pt >= 200.0
    obj: L1puppiJetSC8:default


# B Jet Seeds
L1_PFHTT_QuadJet_BTagNNScore:
  cross_masks:
    - (leg2.btagScore + leg3.btagScore + leg4.btagScore + leg5.btagScore) > 2.20
  leg1:
    threshold_cut: offline_pt >= 299.0
    obj: L1puppiJetSC4sums:HT
  leg2:
    threshold_cut: pt >= 25
    obj: L1puppiExtJetSC4:default
  leg3:
    threshold_cut: pt >= 25
    obj: L1puppiExtJetSC4:default
  leg4:
    threshold_cut: pt >= 25
    obj: L1puppiExtJetSC4:default
  leg5:
    threshold_cut: pt >= 25
    obj: L1puppiExtJetSC4:default

L1_PFHTT_QuadJetNG_BTagNNScore:
  cross_masks:
    - (leg2.bTagScore + leg3.bTagScore + leg4.bTagScore + leg5.bTagScore) > 0.30
  leg1:
    threshold_cut: offline_pt >= 299.0
    obj: L1puppiJetSC4sums:HT
  leg2:
    threshold_cut: pt >= 25
    obj: L1puppiJetSC4NG:default
  leg3:
    threshold_cut: pt >= 25
    obj: L1puppiJetSC4NG:default
  leg4:
    threshold_cut: pt >= 25
    obj: L1puppiJetSC4NG:default
  leg5:
    threshold_cut: pt >= 25
    obj: L1puppiJetSC4NG:default
