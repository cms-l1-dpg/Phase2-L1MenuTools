JetMatching_Eta_SC8_Pt40To100:
  sample: TT
  version: V49nano_RelVal
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "eta"
    label: "Gen Jets"
    cuts:
      event:
        - "{pt} > 40"
        - "{pt} < 100"
      object:
        - "abs({eta}) < 5"
  test_objects:
    L1puppiJetSC8:default: "eta"
    L1puppiJetSC8:mass30: "eta"
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching Efficiency (40-100 GeV)"
  binning:
    min: -5
    max: 5
    step: 0.25

JetMatching_Eta_SC8_Pt100ToInf:
  sample: TT
  version: V49nano_RelVal
  match_test_to_ref: True
  reference_object:
    object: "GenJetAK8"
    x_arg: "eta"
    label: "Gen Jets"
    cuts:
      event:
        - "{pt} > 100"
      object:
        - "abs({eta}) < 5"
  test_objects:
    L1puppiJetSC8:default: "eta"
    L1puppiJetSC8:mass30: "eta"
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching Efficiency (>100 GeV)"
  binning:
    min: -5
    max: 5
    step: 0.25
