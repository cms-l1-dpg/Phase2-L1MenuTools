# Purity and fake rates of HLT AK4 PUPPI jets vs the L1 SC4 PUPPI jet (`purity:` block, see
# docs/object-performance.md#purity-fake-rate-and-multiplicity). Run on an L1+HLT cache.
# HLT jets: hltAK4PuppiJetCorr (HLT JEC applied, menu_tools/caching/make_hlt_jets_corr.py): thresholds on the corrected pt.
# Fake (pileup) jets: no GenJet (pT > 10 GeV, hard-scatter particles only) within match_dR.

HLTJetsPurity:
  sample: TT
  version: V50nano
  test_objects:
    hltAK4PuppiJetCorr:extended: "pt"
    L1puppiJetSC4:default: "pt"
  purity:
    mode: purity
    reference_gen: &gen_jet
      object: GenJet
      label: "gen jet ($p_T$ > 10 GeV)"
      cuts:
        - "{pt} > 10"
    vs:
      pt: {edges: [0, 10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 300]}
      eta: {min: -5, max: 5, step: 0.25}
      pu: &pu_bins {edges: [140, 170, 185, 195, 205, 215, 230, 260]}
    thresholds: [30, 50, 100]

HLTJetsFakeRate:
  sample: TT
  version: V50nano
  test_objects:
    hltAK4PuppiJetCorr:extended: "pt"
    L1puppiJetSC4:default: "pt"
  purity:
    mode: fake_rate
    reference_gen: *gen_jet
    vs:
      eta: {min: -5, max: 5, step: 0.25}
      pu: *pu_bins
      threshold: &thr_jet {min: 0, max: 200, step: 10}
    thresholds: [30, 50, 100]

HLTJetsMultiplicityMinBias:
  sample: MinBias
  version: V50nano
  test_objects:
    hltAK4PuppiJetCorr:extended: "pt"
    L1puppiJetSC4:default: "pt"
  purity:
    mode: multiplicity
    vs:
      eta: {min: -5, max: 5, step: 0.25}
      pu: *pu_bins
      threshold: *thr_jet
    thresholds: [30, 50, 100]
