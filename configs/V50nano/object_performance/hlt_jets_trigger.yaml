# HLT AK4 PUPPI jets (hltAK4PuppiJet) vs the L1 seeded-cone PUPPI jets, ttbar.
# Object definitions: configs/V50nano/objects/hlt.yaml.

HLTJetTurnonBarrel:
  sample: TT
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen Jets"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    hltAK4PuppiJet:default:barrel: "pt"
    L1puppiJetSC4:default:barrel: "pt"
  thresholds: [100, 200, 300]
  scalings:
    method: "naive"
    threshold: 0.95
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Trigger Efficiency (barrel, $p_T > <threshold>$ GeV)"
  binning:
    min: 0
    max: 500
    step: 10

