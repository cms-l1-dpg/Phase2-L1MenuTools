# Fake rates of L1 taus (`purity:` block, see docs/object-performance.md#purity-fake-rate-and-multiplicity).
#  - VBF H -> tautau: fake fraction, unmatched taus per event, events with >= 1 unmatched tau above threshold.
#  - Minimum bias: taus per event and rate (kHz) of events with >= 1 tau above threshold (no gen matching).

TausFakeRate:
  sample: VBFHToTauTau
  version: V50nano
  test_objects:
    L1nnPuppiTau:default: "pt"
    L1caloTau:default: "pt"
    L1nnCaloTau:default: "pt"
  purity:
    mode: fake_rate
    reference_gen:
      object: GenVisTau
      label: "gen vis. $\\tau_h$"
    vs:
      pt: {edges: [0, 10, 20, 30, 40, 50, 60, 80, 100, 150, 200]}
      eta: {min: -2.4, max: 2.4, step: 0.2}
      pu: &pu_bins {edges: [140, 170, 185, 195, 205, 215, 230, 260]}
      threshold: &thr_tau {min: 0, max: 150, step: 5}
    thresholds: [30, 50]

TausMultiplicityMinBias:
  sample: MinBias
  version: V50nano
  test_objects:
    L1nnPuppiTau:default: "pt"
    L1caloTau:default: "pt"
    L1nnCaloTau:default: "pt"
  purity:
    mode: multiplicity
    vs:
      eta: {min: -2.4, max: 2.4, step: 0.2}
      pu: *pu_bins
      threshold: *thr_tau
    thresholds: [30, 50]
