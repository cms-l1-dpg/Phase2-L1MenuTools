# HLT HPS taus (hltHpsPFTau, no ID / Medium / Loose DeepTau) vs the L1 NN PUPPI tau, HH -> bbtautau.
# hltHpsPFTau stored only if an L1 tau seed fired: HLT efficiency is L1 x HLT-like.
# Reference: visible gen taus with |eta| < 2.1 (the HLT tau paths cut |eta| < 2.1).
# Object definitions: configs/V50nano/objects/hlt.yaml.

HLTTauTriggerBarrel:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    hltHpsPFTau:MediumDeepTau:barrel: "pt"
    hltHpsPFTau:LooseDeepTau:barrel: "pt"
    L1nnPuppiTau:default:barrel: "pt"
  thresholds: [27, 35]
  scalings:
    method: "naive"
    threshold: 0.9
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Trigger Efficiency (barrel, $p_T > <threshold>$ GeV)"
  binning:
    min: 0
    max: 150
    step: 6

HLTTauTriggerEndcap:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) > 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    hltHpsPFTau:MediumDeepTau:endcap: "pt"
    hltHpsPFTau:LooseDeepTau:endcap: "pt"
    L1nnPuppiTau:default:endcap: "pt"
  thresholds: [27, 35]
  scalings:
    method: "naive"
    threshold: 0.9
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Trigger Efficiency (endcap, $p_T > <threshold>$ GeV)"
  binning:
    min: 0
    max: 150
    step: 6
