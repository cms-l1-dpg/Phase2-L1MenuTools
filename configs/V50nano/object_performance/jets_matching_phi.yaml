JetMatching_Phi_Pt40To100:
  sample: TT
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "phi"
    label: "Gen Jets"
    cuts:
      event:
        - "{pt} > 40"
        - "{pt} < 100"
      object:
        - "abs({eta}) < 5"
  test_objects:
    # L1puppiJetHisto:default: "phi"
    L1puppiJetSC4:default: "phi"
    L1caloJet:default: "phi"
    L1TrackJet:default: "phi"
  xlabel: "Gen. $\\phi$"
  ylabel: "Matching Efficiency (40-100 GeV)"
  binning:
    min: -5
    max: 5
    step: 0.25

