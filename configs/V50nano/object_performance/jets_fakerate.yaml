# Fake rates of L1 jets (`purity:` block, see docs/object-performance.md#purity-fake-rate-and-multiplicity).
#  - ttbar: fake (pileup) jets = L1 jets with no GenJet (pT > 10 GeV) within match_dR: fake fraction,
#    unmatched jets per event, events with >= 1 unmatched jet above threshold, vs threshold and pileup.
#  - Minimum bias: jets per event and rate (kHz) of events with >= 1 jet above threshold (no gen matching).

JetsFakeRate:
  sample: TT
  version: V50nano
  test_objects:
    L1puppiJetSC4:default: "pt"
    L1puppiJetSC4NG:default: "pt"
    L1caloJet:default: "pt"
  purity:
    mode: fake_rate
    reference_gen:
      object: GenJet
      label: "gen jet ($p_T$ > 10 GeV)"
      cuts:
        - "{pt} > 10"
    vs:
      pt: {edges: [0, 10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 300]}
      eta: {min: -5, max: 5, step: 0.25}
      pu: &pu_bins {edges: [140, 170, 185, 195, 205, 215, 230, 260]}
      threshold: &thr_jet {min: 0, max: 200, step: 10}
    thresholds: [30, 50, 100]

JetsMultiplicityMinBias:
  sample: MinBias
  version: V50nano
  test_objects:
    L1puppiJetSC4:default: "pt"
    L1puppiJetSC4NG:default: "pt"
    L1caloJet:default: "pt"
  purity:
    mode: multiplicity
    vs:
      eta: {min: -5, max: 5, step: 0.25}
      pu: *pu_bins
      threshold: *thr_jet
    thresholds: [30, 50, 100]
