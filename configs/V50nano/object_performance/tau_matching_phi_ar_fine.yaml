TauMatching_PhiFine_Pt40To100AR:
  sample: VBFHToTauTau
  version: V50nano
  match_test_to_ref: True
  reference_object: 
    object: "GenVisTau"
    x_arg: "phi"
    label: "Gen Taus"
    cuts:
      event:
        - "{pt} > 40"
        - "{pt} < 100"
      object:
        - "abs({eta}) < 1.3"
  test_objects:
    L1nnPuppiTau:default: "phi"
    L1caloTau:default: "phi"
  xlabel: "Gen. $\\phi$"
  ylabel: "Matching Efficiency (40-100 GeV)"
  binning:
    min: -3.2
    max: 3.2
    step: 0.05

