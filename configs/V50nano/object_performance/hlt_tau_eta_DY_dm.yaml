# DY copy of hlt_tau_eta_dm.yaml (DYLL_M50, run with --version V50nano_170pre6HLT): the same plots,
# objects and gen selection as hlt_tau_eta_dm.yaml (HHTo2B2Tau), plot names + "_DY", no scalings (the
# scalings stay from HHTo2B2Tau).
# Finer low-pT binning (0-100 GeV in 4 GeV; resolution vs pT 20-100 GeV): DY visible taus
# are soft (200k events, |eta| < 2.1: 27k visible taus with pT > 20 GeV, 4.9k with pT > 40
# GeV, 0.76k above 60 GeV), so the plateau above ~60 GeV is statistics-limited. The
# single-tau efficiencies (matching, turn-ons, resolution) are the main DY result.
# The decay-mode summary_range (fractions JSON, _dm files) is the HHTo2B2Tau one cut at 100 GeV.
# hltHpsPFTau is stored only in events in which an L1 tau seed fired: in DY (soft taus,
# rarely two above the L1 double-tau thresholds) far fewer events have HLT taus than in HH,
# so the HLT matching and matching + trigger efficiencies are much lower than in HH. The
# trigger efficiency given the match (hlt_tau_trigger) is the object-level comparison.
# Generated from hlt_tau_eta_dm.yaml (scripts/make_dy_tau_configs.py); keep in sync.
#
# Header of hlt_tau_eta_dm.yaml:
#   Decay-mode split of hlt_tau_eta.yaml (`split_by`, see docs/object-performance.md).
#   Same plots as hlt_tau_eta.yaml (plot names + "_DM", no scalings), plus, per test object, the inclusive
#   curve and one curve per generator decay mode of the visible gen tau, and a fractions JSON.
#   GenVisTau_status (CMSSW GenVisTauProducer, JetMCTagUtils::genTauDecayMode): 0 = 1-prong,
#   1 = 1-prong + 1 pi0, 2 = 1-prong + 2 pi0, 10 = 3-prong, 11 = 3-prong + 1 pi0, 15 = other
#   (other: neutral hadrons, >= 3 pi0, 3-prong + >= 2 pi0, 5-prong, ...; ~6% of the taus).
#   Generated from hlt_tau_eta.yaml; keep in sync.

HLTTauMatching_Eta_Pt40ToInf_DY_DM:
  sample: DYLL_M50
  version: V50nano
  match_test_to_ref: true
  reference_object:
    object: GenVisTau
    x_arg: eta
    label: Gen Taus
    cuts:
      event: ['{pt} > 40']
      object: ['abs({eta}) < 2.1']
  test_objects:
    hltHpsPFTau:default: eta
    hltHpsPFTau:MediumDeepTau: eta
    hltHpsPFTau:LooseDeepTau: eta
    L1nnPuppiTau:default: eta
  xlabel: Gen. $\eta$
  ylabel: Matching Efficiency (gen vis. $p_T$ > 40 GeV)
  binning:
    min: -2.2
    max: 2.2
    step: 0.2
  split_by:
    field: status
    name: ''
    categories:
      1-prong: [0]
      1-prong + $\pi^0$s: [1, 2]
      3-prong: [10]
      3-prong + $\pi^0$: [11]

HLTTauTrigger_Eta_Pt50ToInf_wMatching_DY_DM:
  sample: DYLL_M50
  version: V50nano
  match_test_to_ref: true
  matching_and_threshold: true
  threshold_field: pt
  reference_object:
    object: GenVisTau
    x_arg: eta
    label: Gen Taus
    cuts:
      event: ['{pt} > 50']
      object: ['abs({eta}) < 2.1']
  test_objects:
    hltHpsPFTau:MediumDeepTau: eta
    hltHpsPFTau:LooseDeepTau: eta
    L1nnPuppiTau:default: eta
  thresholds: [35]
  xlabel: Gen. $\eta$
  ylabel: Matching + Trigger Eff. ($p_T > <threshold>$ GeV, gen vis. $p_T$ > 50 GeV)
  binning:
    min: -2.2
    max: 2.2
    step: 0.2
  split_by:
    field: status
    name: ''
    categories:
      1-prong: [0]
      1-prong + $\pi^0$s: [1, 2]
      3-prong: [10]
      3-prong + $\pi^0$: [11]
