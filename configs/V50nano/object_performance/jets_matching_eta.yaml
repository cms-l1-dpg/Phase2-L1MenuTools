JetMatching_Eta_Pt40To100:
  # GenJets within dR < 0.4 of a prompt gen e/mu (incl. leptonic tau decays) are not jets:
  # removed from the reference (docs/object-performance.md#reference-cleaning-reference_cleaning)
  reference_cleaning: &prompt_leptons
    object: GenPart
    cuts:
      - "{status} == 1"
      - "(abs({pdgId}) == 11) | (abs({pdgId}) == 13)"
      - "({statusFlags} & 33) > 0"  # isPrompt (bit 0) | isDirectPromptTauDecayProduct (bit 5)
      - "{pt} > 10"
    dR: 0.4
  sample: TT
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "eta"
    label: "Gen Jets"
    cuts:
      event:
        - "{pt} > 40"
        - "{pt} < 100"
      object:
        - "abs({eta}) < 5"
  test_objects:
    # L1puppiJetHisto:default: "eta"
    L1puppiJetSC4:default: "eta"
    L1caloJet:default: "eta"
    L1TrackJet:default: "eta"
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching Efficiency (40-100 GeV)"
  binning:
    min: -5
    max: 5
    step: 0.25

