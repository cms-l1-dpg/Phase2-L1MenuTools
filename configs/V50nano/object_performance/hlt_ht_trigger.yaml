# HLT PUPPI HT / MHT vs the L1 seeded-cone PUPPI sums, ttbar.
#   hltPuppiJetCorrSums: HT and MHT from the JEC-corrected HLT jets with the HLT menu definitions
#     (HT: pT > 30, |eta| < 2.4, pT sum, as HLT_PFPuppiHT1070; MHT: E_T > 30, |eta| < 5),
#     menu_tools/caching/make_hlt_jets_corr.py.
#   hltPFPuppiHT: nano value (sumEt of hltPFPuppiMHT: corrected jets E_T > 30, |eta| < 5), for comparison.
#   hltPuppiJetSums: from the uncorrected nano jets (make_hlt_sums.py), for comparison.
# Object definitions: configs/V50nano/objects/hlt.yaml.

HLT_HT_90perc:
  sample: TT
  version: V50nano
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen HT"
    trafo: "HT"
    cuts:
      object:
        - "abs({eta}) < 2.4"
        - "{pt} > 30"
  test_objects:
    hltPuppiJetCorrSums:HT: "pt"
    hltPFPuppiHT:default: "pt"
    L1puppiJetSC4sums:HT: "pt"
  thresholds: [300, 500]
  scalings:
    method: "naive"
    threshold: 0.9
  xlabel: "Gen. HT (GeV)"
  ylabel: "Trigger Efficiency (<threshold> GeV)"
  binning:
    min: 0
    max: 1000
    step: 20

HLT_MHT_50perc:
  sample: TT
  version: V50nano
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen MHT"
    trafo: "MHT"
    cuts:
      object:
        - "abs({eta}) < 2.4"
        - "{pt} > 30"
  test_objects:
    hltPuppiJetCorrSums:MHT: "pt"
    hltPuppiJetSums:MHT: "pt"
    L1puppiJetSC4sums:MHT: "pt"
  thresholds: [100, 140]
  scalings:
    method: "naive"
    threshold: 0.5
  xlabel: "Gen. MHT30 (GeV)"
  ylabel: "Trigger Efficiency (<threshold> GeV)"
  binning:
    min: 0
    max: 500
    step: 20
