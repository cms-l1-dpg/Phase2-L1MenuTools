# HLT PUPPI HT / MHT vs the L1 seeded-cone PUPPI sums, ttbar.
#   hltPuppiJetCorrSums: HT and MHT from the JEC-corrected HLT jets with the HLT menu definitions
#     (HT: pT > 30, |eta| < 2.4, pT sum, as HLT_PFPuppiHT1070; MHT: E_T > 30, |eta| < 5),
#     menu_tools/caching/make_hlt_jets_corr.py.
#   hltPFPuppiHT: nano value (sumEt of hltPFPuppiMHT: corrected jets E_T > 30, |eta| < 5), for comparison.
#   hltPuppiJetSums: from the uncorrected nano jets (make_hlt_sums.py), for comparison.
# Object definitions: configs/V50nano/objects/hlt.yaml.

HLT_HT_90perc:
  # GenJets within dR < 0.4 of a prompt gen e/mu (incl. leptonic tau decays) are not jets:
  # removed from the reference (docs/object-performance.md#reference-cleaning-reference_cleaning)
  reference_cleaning: &prompt_leptons
    object: GenPart
    cuts:
      - "{status} == 1"
      - "(abs({pdgId}) == 11) | (abs({pdgId}) == 13)"
      - "({statusFlags} & 33) > 0"  # isPrompt (bit 0) | isDirectPromptTauDecayProduct (bit 5)
      - "{pt} > 10"
    dR: 0.4
  sample: TT
  version: V50nano
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen HT"
    trafo: "HT"
    cuts:
      object:
        - "abs({eta}) < 2.4"
        - "{pt} > 30"
  test_objects:
    hltPuppiJetCorrSums:HT: "pt"
    hltPFPuppiHT:default: "pt"
    L1puppiJetSC4sums:HT: "pt"
  thresholds: [300, 500]
  scalings:
    # L1 objects are comparison curves here; their scalings come from the L1 configs
    objects: ["hltPuppiJetCorrSums:HT", "hltPFPuppiHT:default"]
    method: "naive"
    threshold: 0.9
  xlabel: "Gen. HT (GeV)"
  ylabel: "Trigger Efficiency (<threshold> GeV)"
  binning:
    min: 0
    max: 1000
    step: 20

HLT_MHT_50perc:
  reference_cleaning: *prompt_leptons
  sample: TT
  version: V50nano
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen MHT"
    trafo: "MHT"
    cuts:
      object:
        - "abs({eta}) < 2.4"
        - "{pt} > 30"
  test_objects:
    hltPuppiJetCorrSums:MHT: "pt"
    hltPuppiJetSums:MHT: "pt"
    L1puppiJetSC4sums:MHT: "pt"
  thresholds: [100, 140]
  scalings:
    # L1 objects are comparison curves here; their scalings come from the L1 configs
    objects: ["hltPuppiJetCorrSums:MHT", "hltPuppiJetSums:MHT"]
    method: "naive"
    threshold: 0.5
  xlabel: "Gen. MHT30 (GeV)"
  ylabel: "Trigger Efficiency (<threshold> GeV)"
  binning:
    min: 0
    max: 500
    step: 20
