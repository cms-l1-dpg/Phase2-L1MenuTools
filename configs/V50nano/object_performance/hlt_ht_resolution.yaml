# HLT PUPPI HT / MHT (hltPuppiJetSums: from hltAK4PuppiJet pt > 30, |eta| < 2.4, menu_tools/caching/make_hlt_sums.py)
# vs the L1 seeded-cone PUPPI sums, ttbar.
# Object definitions: configs/V50nano/objects/hlt.yaml.

HLT_HTResolution:
  sample: TT
  version: V50nano
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen HT"
    trafo: "HT"
    cuts:
      object:
        - "abs({eta}) < 2.4"
        - "{pt} > 30"
  test_objects:
    hltPuppiJetSums:HT: "pt"
    L1puppiJetSC4sums:HT: "pt"
  resolution:
    variables: [pt]
    min_ref: 50
    vs:
      pt: {edges: [50, 100, 150, 200, 250, 300, 400, 500, 750, 1000]}
      pu: {edges: [150, 180, 190, 200, 210, 220, 260]}
    response_binning:
      pt: {min: 0, max: 2, step: 0.04}
