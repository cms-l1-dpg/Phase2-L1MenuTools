# Purity of L1 jets (ttbar; `purity:` block, see docs/object-performance.md#purity-fake-rate-and-multiplicity):
# fraction of ALL L1 jets with a gen jet (GenJet, pT > 10 GeV: hard-scatter particles only, so
# pileup jets are unmatched) within the object's match_dR (SC4 0.35, calo 0.3).
# Fake (pileup) jets = L1 jets not matched to a GenJet, the usual definition for jets.

JetsPurity:
  sample: TT
  version: V50nano
  test_objects:
    L1puppiJetSC4:default: "pt"
    L1puppiJetSC4NG:default: "pt"
    L1caloJet:default: "pt"
  purity:
    mode: purity
    reference_gen: &gen_jet
      object: GenJet
      label: "gen jet ($p_T$ > 10 GeV)"
      cuts:
        - "{pt} > 10"
    vs:
      pt: &pt_jet {edges: [0, 10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 300]}
      eta: {min: -5, max: 5, step: 0.25}
      pu: &pu_bins {edges: [140, 170, 185, 195, 205, 215, 230, 260]}
    thresholds: [30, 50, 100]

JetsPurityBarrel:
  sample: TT
  version: V50nano
  test_objects:
    L1puppiJetSC4:default:barrel: "pt"
    L1puppiJetSC4NG:default:barrel: "pt"
    L1caloJet:default:barrel: "pt"
  purity:
    mode: purity
    reference_gen: *gen_jet
    vs: {pt: *pt_jet}

JetsPurityEndcap:
  sample: TT
  version: V50nano
  test_objects:
    L1puppiJetSC4:default:endcap: "pt"
    L1puppiJetSC4NG:default:endcap: "pt"
    L1caloJet:default:endcap: "pt"
  purity:
    mode: purity
    reference_gen: *gen_jet
    vs: {pt: *pt_jet}

JetsPurityForward:
  sample: TT
  version: V50nano
  test_objects:
    L1puppiJetSC4:default:forwardHGC: "pt"
    L1puppiJetSC4:default:forwardHF: "pt"
    L1caloJet:default:forwardHGC: "pt"
    L1caloJet:default:forwardHF: "pt"
  purity:
    mode: purity
    reference_gen: *gen_jet
    vs: {pt: *pt_jet}
