# Purity of L1 e/gamma objects (DY -> ll): fraction of ALL L1 objects passing the object ID / eta
# cuts that have a prompt gen electron within the object's match_dR (`purity:` block, see
# docs/object-performance.md#purity-fake-rate-and-multiplicity). Fake rates: electron_fakerate.yaml.
# Gen electrons: last copy, prompt or from a prompt tau decay (DY M50 includes Z -> tautau).
# Replaces the earlier turn-on based Purity_Electrons* entries (leading L1 tkElectron as the
# reference, GenPart:electron as the test object: leading L1 object only, hard-process gen
# electrons only, and L1EG as a second "test" object, which gave an L1-L1 overlap fraction).

ElectronsPurity:
  sample: DYLL_M50
  version: V50nano
  test_objects:
    L1tkElectron:NoIso: "pt"
    L1tkElectron:Iso: "pt"
    L1EG:default: "pt"
  purity:
    mode: purity
    reference_gen: &gen_e
      object: GenPart
      label: "prompt gen e"
      cuts:
        - "abs({pdgId}) == 11"
        - "(({statusFlags}>>13)&1) == 1"                                     # last copy
        - "((({statusFlags}>>0)&1) == 1) | ((({statusFlags}>>3)&1) == 1)"     # prompt, or prompt tau decay
    vs:
      pt: &pt_e {edges: [0, 2.5, 5, 7.5, 10, 12.5, 15, 20, 25, 30, 35, 40, 50, 60, 80, 100]}
      eta: {min: -2.4, max: 2.4, step: 0.2}
      pu: &pu_bins {edges: [140, 170, 185, 195, 205, 215, 230, 260]}
    thresholds: [10, 30]

ElectronsPurityBarrel:
  sample: DYLL_M50
  version: V50nano
  test_objects:
    L1tkElectron:NoIso:barrel: "pt"
    L1tkElectron:Iso:barrel: "pt"
    L1EG:default:barrel: "pt"
  purity:
    mode: purity
    reference_gen: *gen_e
    vs: {pt: *pt_e, pu: *pu_bins}
    thresholds: [10, 30]

ElectronsPurityEndcap:
  sample: DYLL_M50
  version: V50nano
  test_objects:
    L1tkElectron:NoIso:endcap: "pt"
    L1tkElectron:Iso:endcap: "pt"
    L1EG:default:endcap: "pt"
  purity:
    mode: purity
    reference_gen: *gen_e
    vs: {pt: *pt_e, pu: *pu_bins}
    thresholds: [10, 30]

ElectronsPurityLeading:
  sample: DYLL_M50
  version: V50nano
  test_objects:
    L1tkElectron:NoIso: "pt"
    L1tkElectron:Iso: "pt"
    L1EG:default: "pt"
  purity:
    mode: purity
    leading_only: true
    reference_gen: *gen_e
    vs: {pt: *pt_e}
