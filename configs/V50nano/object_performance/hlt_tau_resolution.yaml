# HLT HPS taus (hltHpsPFTau, no ID / Medium / Loose DeepTau) vs the L1 NN PUPPI tau, HH -> bbtautau.
# hltHpsPFTau stored only if an L1 tau seed fired: HLT efficiency is L1 x HLT-like.
# Reference: visible gen taus with |eta| < 2.1 (the HLT tau paths cut |eta| < 2.1).
# Object definitions: configs/V50nano/objects/hlt.yaml.

HLTTauResolutionBarrel:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    hltHpsPFTau:default: "pt"
    L1nnPuppiTau:default: "pt"
  resolution:
    variables: [pt, eta, phi]
    vs:
      pt: {edges: [20, 30, 40, 50, 60, 80, 100, 150]}
      pu: {edges: [150, 180, 190, 200, 210, 220, 260]}
    response_binning:
      pt: {min: 0, max: 3, step: 0.04}

HLTTauResolutionEndcap:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) > 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    hltHpsPFTau:default: "pt"
    L1nnPuppiTau:default: "pt"
  resolution:
    variables: [pt, eta, phi]
    vs:
      pt: {edges: [20, 30, 40, 50, 60, 80, 100, 150]}
      pu: {edges: [150, 180, 190, 200, 210, 220, 260]}
    response_binning:
      pt: {min: 0, max: 3, step: 0.04}
