JetTurnonBarrel:
  # GenJets within dR < 0.4 of a prompt gen e/mu (incl. leptonic tau decays) are not jets:
  # removed from the reference (docs/object-performance.md#reference-cleaning-reference_cleaning)
  reference_cleaning: &prompt_leptons
    object: GenPart
    cuts:
      - "{status} == 1"
      - "(abs({pdgId}) == 11) | (abs({pdgId}) == 13)"
      - "({statusFlags} & 33) > 0"  # isPrompt (bit 0) | isDirectPromptTauDecayProduct (bit 5)
      - "{pt} > 10"
    dR: 0.4
  version: V50nano
  sample: TT
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen Jets"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    # L1puppiJetHisto:default:barrel: "pt"
    L1puppiJetSC4:default:barrel: "pt"
    L1puppiJetSC4NG:default:barrel: "pt"
    L1caloJet:default:barrel: "pt"
    L1TrackJet:default:barrel: "pt"
  thresholds: [50, 100]
  scalings:
    method: "naive"
    threshold: 0.95
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Trigger Efficiency (<threshold> GeV, barrel)"
  binning:
    min: 0
    max: 500
    step: 10

