# pT / eta / phi response of L1 e/gamma objects to gen photons (H->gg); see docs/object-performance.md
PhotonsResolutionBarrel:
  sample: Hgg
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenPart"
    x_arg: "pt"
    label: "Gen Photons"
    cuts:
      event:
        - "(({statusFlags}>>7)&1) == 1"
        - "abs({pdgId}) == 22"
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    L1EG:default: "pt"
    L1tkPhoton:NoIso: "pt"
    L1tkPhoton:Iso: "pt"
  resolution:
    variables: [pt, eta, phi]
    vs:
      pt: {edges: [10, 20, 30, 40, 50, 60, 70, 80, 100, 150]}
      pu: {edges: [150, 180, 190, 200, 210, 220, 260]}
    response_binning:
      pt: {min: 0, max: 2, step: 0.04}

