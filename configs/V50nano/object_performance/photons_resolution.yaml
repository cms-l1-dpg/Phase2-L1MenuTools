PhotonsResolutionVsEta:
  sample: Hgg
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenPart"
    x_arg: "pt"
    label: "Gen Photons"
    cuts:
      event:
        - "(({statusFlags}>>7)&1) == 1"
        - "abs({pdgId}) == 22"
        - "{pt} > 20"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
