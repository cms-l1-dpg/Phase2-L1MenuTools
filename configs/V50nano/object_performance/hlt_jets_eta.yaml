    L1puppiExtJetSC4:default: "eta"
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching Efficiency (gen $p_T$ > 100 GeV)"
  binning:
    min: -5
    max: 5
    step: 0.25

HLTJetTrigger_Eta_Pt200ToInf_wMatching:
  reference_cleaning: *prompt_leptons
  sample: TT
  version: V50nano
  match_test_to_ref: True
