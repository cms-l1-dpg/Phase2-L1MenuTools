  test_objects:
    hltAK4PuppiJetCorr:extended: "eta"
    L1puppiExtJetSC4:default: "eta"
  thresholds: [100]
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching + Trigger Eff. ($p_T > <threshold>$ GeV, gen $p_T$ > 200 GeV)"
  binning:
    min: -5
    max: 5
    step: 0.25

HLTJetTrigger_Eta_Pt100ToInf_wMatching:
