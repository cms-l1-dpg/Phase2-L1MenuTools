# HLT AK4 PUPPI jets (JEC applied: hltAK4PuppiJetCorr) vs L1 seeded-cone PUPPI jets: efficiency vs gen eta (ttbar).
# |eta| < 5 objects (hltAK4PuppiJetCorr:extended, L1puppiExtJetSC4). Trigger blocks: threshold on the test pT (threshold_field).

HLTJetMatching_Eta_Pt40To100:
  # GenJets within dR < 0.4 of a prompt gen e/mu (incl. leptonic tau decays) are not jets:
  # removed from the reference (docs/object-performance.md#reference-cleaning-reference_cleaning)
  reference_cleaning: &prompt_leptons
    object: GenPart
    cuts:
      - "{status} == 1"
      - "(abs({pdgId}) == 11) | (abs({pdgId}) == 13)"
      - "({statusFlags} & 33) > 0"  # isPrompt (bit 0) | isDirectPromptTauDecayProduct (bit 5)
      - "{pt} > 10"
    dR: 0.4
  sample: TT
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "eta"
    label: "Gen Jets"
    cuts:
      event:
        - "{pt} > 40"
        - "{pt} < 100"
      object:
        - "abs({eta}) < 5"
  test_objects:
    hltAK4PuppiJetCorr:extended: "eta"
    L1puppiExtJetSC4:default: "eta"
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching Efficiency (gen $p_T$ 40-100 GeV)"
  binning:
    min: -5
    max: 5
    step: 0.25

HLTJetMatching_Eta_Pt100ToInf:
  reference_cleaning: *prompt_leptons
  sample: TT
  version: V50nano
  match_test_to_ref: True
  reference_object:
