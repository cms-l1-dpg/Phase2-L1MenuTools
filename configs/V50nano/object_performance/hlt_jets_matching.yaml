# HLT AK4 PUPPI jets with the HLT JEC (hltAK4PuppiJetCorr, menu_tools/caching/make_hlt_jets_corr.py) vs the L1 seeded-cone PUPPI jets, ttbar.
# Object definitions: configs/V50nano/objects/hlt.yaml.

HLTJetMatchingBarrel:
  sample: TT
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen Jets"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    hltAK4PuppiJetCorr:default: "pt"
    L1puppiJetSC4:default: "pt"
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Matching Efficiency (barrel)"
  binning:
    min: 0
    max: 500
    step: 10

HLTJetMatchingEndcap:
