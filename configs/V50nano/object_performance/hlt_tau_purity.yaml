# Purity and fake rates of HLT HPS taus vs the L1 NN PUPPI tau (`purity:` block, see
# docs/object-performance.md#purity-fake-rate-and-multiplicity). Run on an L1+HLT cache.
# hltHpsPFTau is stored only if an L1 tau seed fired. Leptonic tau decays and jets count as fakes.

HLTTausPurity:
  sample: HHTo2B2Tau
  version: V50nano
  test_objects:
    hltHpsPFTau:default: "pt"
    hltHpsPFTau:MediumDeepTau: "pt"
    L1nnPuppiTau:default: "pt"
  purity:
    mode: purity
    reference_gen: &gen_tau
      object: GenVisTau
      label: "gen vis. $\\tau_h$"
    vs:
      pt: {edges: [0, 10, 20, 30, 40, 50, 60, 80, 100, 150, 200]}
      eta: {min: -2.4, max: 2.4, step: 0.2}
      pu: &pu_bins {edges: [140, 170, 185, 195, 205, 215, 230, 260]}
    thresholds: [35, 50]

HLTTausFakeRate:
  sample: HHTo2B2Tau
  version: V50nano
  test_objects:
    hltHpsPFTau:default: "pt"
    hltHpsPFTau:MediumDeepTau: "pt"
    L1nnPuppiTau:default: "pt"
  purity:
    mode: fake_rate
    reference_gen: *gen_tau
    vs:
      pu: *pu_bins
      threshold: &thr_tau {min: 0, max: 150, step: 5}
    thresholds: [35, 50]

HLTTausMultiplicityMinBias:
  sample: MinBias
  version: V50nano
  test_objects:
    hltHpsPFTau:default: "pt"
    hltHpsPFTau:MediumDeepTau: "pt"
    L1nnPuppiTau:default: "pt"
  purity:
    mode: multiplicity
    vs:
      pu: *pu_bins
      threshold: *thr_tau
    thresholds: [35, 50]
