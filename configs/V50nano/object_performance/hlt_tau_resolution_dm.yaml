# Decay-mode split of hlt_tau_resolution.yaml (`split_by`, see docs/object-performance.md).
# Same plots as hlt_tau_resolution.yaml (plot names + "_DM", no scalings), plus, per test object, the inclusive
# curve and one curve per generator decay mode of the visible gen tau, and a fractions JSON.
# GenVisTau_status (CMSSW GenVisTauProducer, JetMCTagUtils::genTauDecayMode): 0 = 1-prong,
# 1 = 1-prong + 1 pi0, 2 = 1-prong + 2 pi0, 10 = 3-prong, 11 = 3-prong + 1 pi0, 15 = other
# (other: neutral hadrons, >= 3 pi0, 3-prong + >= 2 pi0, 5-prong, ...; ~6% of the taus).
# Generated from hlt_tau_resolution.yaml; keep in sync.

HLTTauResolutionBarrel_DM:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: true
  reference_object:
    object: GenVisTau
    x_arg: pt
    label: Gen Taus
    cuts:
      event:
      - abs({eta}) < 1.5
      object:
      - abs({eta}) < 2.1
  test_objects:
    hltHpsPFTau:default: pt
    L1nnPuppiTau:default: pt
  resolution:
    variables:
    - pt
    - eta
    - phi
    vs:
      pt:
        edges:
        - 20
        - 30
        - 40
        - 50
        - 60
        - 80
        - 100
        - 150
      pu:
        edges:
        - 150
        - 180
        - 190
        - 200
        - 210
        - 220
        - 260
    response_binning:
      pt:
        min: 0
        max: 3
        step: 0.04
  split_by: &split_dm
    field: status            # GenVisTau_status: generator decay mode
    name: ""                 # files: <plot>_<test object>_<thr>_<version>, <plot>_fractions_...
    categories:              # status 15 (other) is only in the inclusive curve
      "1-prong": [0]
      "1-prong + $\\pi^0$s": [1, 2]
      "3-prong": [10]
      "3-prong + $\\pi^0$": [11]

HLTTauResolutionEndcap_DM:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: true
  reference_object:
    object: GenVisTau
    x_arg: pt
    label: Gen Taus
    cuts:
      event:
      - abs({eta}) > 1.5
      object:
      - abs({eta}) < 2.1
  test_objects:
    hltHpsPFTau:default: pt
    L1nnPuppiTau:default: pt
  resolution:
    variables:
    - pt
    - eta
    - phi
    vs:
      pt:
        edges:
        - 20
        - 30
        - 40
        - 50
        - 60
        - 80
        - 100
        - 150
      pu:
        edges:
        - 150
        - 180
        - 190
        - 200
        - 210
        - 220
        - 260
    response_binning:
      pt:
        min: 0
        max: 3
        step: 0.04
  split_by: *split_dm
