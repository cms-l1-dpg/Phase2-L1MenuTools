# Fake rates of L1 e/gamma objects (`purity:` block, see docs/object-performance.md#purity-fake-rate-and-multiplicity).
#  - DY -> ll: fake fraction (1 - purity) of all L1 objects, unmatched objects per event and the
#    fraction of events with >= 1 unmatched object above threshold, vs threshold and pileup.
#  - Minimum bias: no gen matching (pruned gen record): objects per event and the rate (kHz) of
#    events with >= 1 object above threshold, vs threshold and pileup.

ElectronsFakeRate:
  sample: DYLL_M50
  version: V50nano
  test_objects:
    L1tkElectron:NoIso: "pt"
    L1tkElectron:Iso: "pt"
    L1EG:default: "pt"
  purity:
    mode: fake_rate
    reference_gen:
      object: GenPart
      label: "prompt gen e"
      cuts:
        - "abs({pdgId}) == 11"
        - "(({statusFlags}>>13)&1) == 1"
        - "((({statusFlags}>>0)&1) == 1) | ((({statusFlags}>>3)&1) == 1)"
    vs:
      pt: {edges: [0, 2.5, 5, 7.5, 10, 12.5, 15, 20, 25, 30, 35, 40, 50, 60, 80, 100]}
      eta: {min: -2.4, max: 2.4, step: 0.2}
      pu: &pu_bins {edges: [140, 170, 185, 195, 205, 215, 230, 260]}
      threshold: &thr_e {min: 0, max: 60, step: 2}
    thresholds: [10, 20, 30]

ElectronsMultiplicityMinBias:
  sample: MinBias
  version: V50nano
  test_objects:
    L1tkElectron:NoIso: "pt"
    L1tkElectron:Iso: "pt"
    L1EG:default: "pt"
  purity:
    mode: multiplicity
    vs:
      eta: {min: -2.4, max: 2.4, step: 0.2}
      pu: *pu_bins
      threshold: *thr_e
    thresholds: [10, 20, 30]
