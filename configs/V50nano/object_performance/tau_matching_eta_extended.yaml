TauMatching_Eta_Pt40To100_Extended:
  sample: VBFHToTauTau
  version: V50nano
  match_test_to_ref: True
  reference_object: 
    object: "GenVisTau"
    x_arg: "eta"
    label: "Gen Taus"
    cuts:
      event:
        - "{pt} > 40"
        - "{pt} < 100"
      object:
        - "abs({eta}) < 5.0"
  test_objects:
    L1nnPuppiTau:extended: "eta"
    L1caloTau:extended: "eta"
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching Efficiency (40-100 GeV)"
  binning:
    min: -3.0
    max: 3.0
    step: 0.2

TauMatching_Eta_Pt100ToInf_Extended:
  sample: VBFHToTauTau
  version: V50nano
  match_test_to_ref: True
  reference_object: 
    object: "GenVisTau"
    x_arg: "eta"
    label: "Gen Taus"
    cuts:
      event:
        - "{pt} > 100"
      object:
        - "abs({eta}) < 5"
  test_objects:
    L1nnPuppiTau:extended: "eta"
    L1caloTau:extended: "eta"
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching Efficiency (>100 GeV)"
  binning:
    min: -3.0
    max: 3.0
    step: 0.2
