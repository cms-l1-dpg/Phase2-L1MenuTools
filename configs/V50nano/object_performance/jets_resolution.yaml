# pT / eta / phi response of L1 jets to gen jets (ttbar): SC4 vs GenJet, SC8 vs GenJetAK8; see docs/object-performance.md
JetResolutionBarrel:
  # GenJets within dR < 0.4 of a prompt gen e/mu (incl. leptonic tau decays) are not jets:
  # removed from the reference (docs/object-performance.md#reference-cleaning-reference_cleaning)
  reference_cleaning: &prompt_leptons
    object: GenPart
    cuts:
      - "{status} == 1"
      - "(abs({pdgId}) == 11) | (abs({pdgId}) == 13)"
      - "({statusFlags} & 33) > 0"  # isPrompt (bit 0) | isDirectPromptTauDecayProduct (bit 5)
      - "{pt} > 10"
    dR: 0.4
  sample: TT
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen Jets"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    L1puppiJetSC4:default: "pt"
    L1puppiJetSC4NG:default: "pt"
    L1caloJet:default: "pt"
    L1TrackJet:default: "pt"
  resolution:
    variables: [pt, eta, phi]
    vs:
      pt: {edges: [20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 300, 500]}
      pu: {edges: [150, 180, 190, 200, 210, 220, 260]}
    response_binning:
      pt: {min: 0, max: 2, step: 0.04}

