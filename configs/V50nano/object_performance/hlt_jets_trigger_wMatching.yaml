# HLT AK4 PUPPI jets with the HLT JEC (hltAK4PuppiJetCorr, menu_tools/caching/make_hlt_jets_corr.py) vs the L1 seeded-cone PUPPI jets, ttbar.
# Object definitions: configs/V50nano/objects/hlt.yaml.

HLTJetTurnonBarrel_wMatching:
  sample: TT
  version: V50nano
  match_test_to_ref: True
  matching_and_threshold: True
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen Jets"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    hltAK4PuppiJetCorr:default:barrel: "pt"
    L1puppiJetSC4:default:barrel: "pt"
  thresholds: [30, 50, 100, 200, 300]
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Matching + Trigger Efficiency (barrel, $p_T > <threshold>$ GeV)"
  binning:
    min: 0
    max: 500
    step: 5

