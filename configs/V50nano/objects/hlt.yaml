# Phase-2 HLT objects (nano hlt* collections of the L1+HLT nanos, CMSSW_17_0_0_pre6).
#
# The ids approximate the selections of the Phase-2 HLT menu in
#   HLTrigger/Configuration/python/HLT_75e33/ (CMSSW_17_0_0_pre6, paths/ and modules/)
# with the variables the nano stores (HLTrigger/NGTScouting/python/hlt*_cfi.py). Ids whose cuts
# are not the full HLT selection are labelled "(approx.)"; the comments say what is missing.
#
# Cut strings: "{field}" is a branch of the collection (without the "<collection>_" prefix);
# several fields may appear in one expression (e.g. "{ecalIso} < 9 + 0.02*{pt}").
# Cuts listed under an eta range apply only to objects within that range.
#
# Caveats of the stored collections:
#  - hltMuon (hltPhase2L3MuonIdTracks) is stored only in events with an L1 tkMuon, has no
#    isolation and no charge: HLT muon efficiencies include the L1 tkMuon reconstruction.
#  - hltHpsPFTau is stored only if an L1 tau seed fired: HLT tau efficiencies are L1 x HLT-like.
#  - hltElectron / hltPhoton are the unseeded e/gamma candidates split by the scouting packer:
#    candidates WITH an associated GSF track are electrons, the others photons. A photon that
#    has a GSF track therefore is in hltElectron, not in hltPhoton (the HLT photon paths do not
#    veto tracks).
#  - In the endcap (HGCAL, |eta| > 1.479) the nano sigmaIetaIeta, hOverE, hcalIso (and mostly
#    ecalIso, sMaj, sMin) are 0: the HLT uses HGCAL variables there (sigma2vv, sigma2ww,
#    hForHOverE, HGCal layer-cluster iso) which are not in the nano. Endcap e/gamma ids are
#    therefore only the track-based cuts (+ track isolation).


hltMuon:
  label: "HLT Muon"
  match_dR: 0.1
  eta_ranges:
    inclusive: [0, 7]
    barrel: [0, 0.83]
    overlap: [0.83, 1.24]
    endcap: [1.24, 2.4]
  ids:
    # L3 muon (hltPhase2L3MuonIdTracks), no isolation. HLT_Mu50 / HLT_IsoMu24_FromL1TkMuon:
    # L1 pSingleTkMuon22 seed + L3 pt cut (hltL3fL1TkSingleMu22L3Filtered24Q: minPt 24, no
    # eta cut, minMuonStations 1); IsoMu24 adds ECAL/HCAL/HGCAL/track isolation (not in nano).
    default:
      label: "HLT Muon (L3, no iso; L1 tkMu events)"
      cuts:
        inclusive:
          - "abs({eta}) < 2.4"


hltElectron:
  label: "HLT Electron"
  match_dR: 0.1
  eta_ranges:
    inclusive: [0, 7]
    barrel: [0, 1.479]
    endcap: [1.479, 3.0]
  ids:
    # Unseeded e/gamma candidate with a GSF track (pixel match + GSF tracking done), no ID.
    default:
      label: "HLT Electron (no ID)"
      cuts:
        inclusive:
          - "abs({eta}) < 3.0"

    # HLT_Ele32_WPTight_Unseeded (HLTEle32WPTightUnseededSequence), filters
    # hltEle32WPTight*UnseededFilter. HLT thresholds are  var < a + b*E  with E = SC energy, or
    # SC Et (= nano pt) where useEt = True; no rho correction (doRhoCorrection = False).
    # Implemented (nano field <- HLT variable):
    #   sigmaIetaIeta <- hltEgammaClusterShapeUnseeded:sigmaIEtaIEta5x5 < 0.013 (EB, EE)
    #       (nano: the noise-cleaned 5x5 value; EE value is 0 in nano -> cut not effective)
    #   hOverE        <- hltEgammaHoverEUnseeded / E_SC: H < 0.175 E (EB) -> hOverE < 0.175
    #   ecalIso       <- hltEgammaEcalPFClusterIsoUnseeded < 9 + 0.02 Et
    #   hcalIso       <- hltEgammaHcalPFClusterIsoUnseeded < 19 + 0.02 Et
    #   ooEMOop       <- OneOESuperMinusOneOP < 0.04 (|eta|<0.8), 0.08 (0.8-1.479), 0.04 (EE)
    #   dEtaIn        <- DetaSeed < 0.003 (|eta|<0.8), 0.009 (0.8-1.479), 0.004 (EE)
    #   dPhiIn        <- Dphi     < 0.02  (|eta|<0.8), 0.09  (0.8-1.479), 0.04  (EE)
    #   trackIso      <- hltEgammaEleGsfTrackIsoUnseeded < 2.5 (EB), 2.2 (EE) GeV
    #   ooEMOop/dEtaIn/dPhiIn: the HLT filters compare the SIGNED value (producer
    #   produceAbsValues = False, filter useAbs = False), i.e. the cut is one-sided; emulated as
    #   such. Nano takes them from hltEgammaBestGsfTrackVarsUnseeded (GSF electrons), the HLT
    #   from hltEgammaGsfTrackVarsUnseeded (GSF tracks).
    # Not in nano (not applied): EE sigma2vv < 0.7225 + 0.0008 Et, sigma2ww < 72.25 + 0.04 Et,
    #   EE HGCAL H/E (hForHOverE < 5 + 0.15 E), HGCAL iso (< 150 / 350 + 0.05 E), pixel-match
    #   s2 (PMS2), GSF NLayerIT >= 3 and chi2 < 50, L1-track isolation (< 5.5 / 8.0 / 5.5 GeV).
    WPTight:
      label: "HLT Electron, WPTight (approx.)"
      cuts:
        inclusive:
          - "abs({eta}) < 3.0"
          - "{sigmaIetaIeta} < 0.013"
          - "{ecalIso} < 9 + 0.02*{pt}"
          - "{hcalIso} < 19 + 0.02*{pt}"
        barrel:
          - "{hOverE} < 0.175"
          - "(abs({eta}) >= 0.8) | ({ooEMOop} < 0.04)"
          - "(abs({eta}) < 0.8) | ({ooEMOop} < 0.08)"
          - "(abs({eta}) >= 0.8) | ({dEtaIn} < 0.003)"
          - "(abs({eta}) < 0.8) | ({dEtaIn} < 0.009)"
          - "(abs({eta}) >= 0.8) | ({dPhiIn} < 0.02)"
          - "(abs({eta}) < 0.8) | ({dPhiIn} < 0.09)"
          - "{trackIso} < 2.5"
        endcap:
          - "{ooEMOop} < 0.04"
          - "{dEtaIn} < 0.004"
          - "{dPhiIn} < 0.04"
          - "{trackIso} < 2.2"

    # HLT_Ele26_WP70_Unseeded (hltEle26WP70*UnseededFilter), same structure as WPTight:
    #   sigmaIetaIeta < 0.013; H/E < 0.17 (EB); ecalIso < 4.4 + 0.02 Et; hcalIso < 12 + 0.02 Et;
    #   ooEMOop < 0.035 / 0.08 / 0.01 (EE); dEtaIn < 0.003 / 0.009 / 0.003 (EE);
    #   dPhiIn < 0.02 / 0.09 / 0.02 (EE); trackIso < 1.76 (EB and EE).
    # Not applied (not in nano): as for WPTight (EE sigma2vv < 0.64 + 0.0008 Et, sigma2ww <
    #   64 + 0.04 Et, HGCAL H/E < 5 + 0.15 E, HGCAL iso < 130 / 340 + 0.05 E, PMS2, NLayerIT,
    #   chi2, L1-track iso < 4.0 / 8.0 / 5.5 GeV).
    WP70:
      label: "HLT Electron, WP70 (approx.)"
      cuts:
        inclusive:
          - "abs({eta}) < 3.0"
          - "{sigmaIetaIeta} < 0.013"
          - "{ecalIso} < 4.4 + 0.02*{pt}"
          - "{hcalIso} < 12 + 0.02*{pt}"
          - "{trackIso} < 1.76"
        barrel:
          - "{hOverE} < 0.17"
          - "(abs({eta}) >= 0.8) | ({ooEMOop} < 0.035)"
          - "(abs({eta}) < 0.8) | ({ooEMOop} < 0.08)"
          - "(abs({eta}) >= 0.8) | ({dEtaIn} < 0.003)"
          - "(abs({eta}) < 0.8) | ({dEtaIn} < 0.009)"
          - "(abs({eta}) >= 0.8) | ({dPhiIn} < 0.02)"
          - "(abs({eta}) < 0.8) | ({dPhiIn} < 0.09)"
        endcap:
          - "{ooEMOop} < 0.01"
          - "{dEtaIn} < 0.003"
          - "{dPhiIn} < 0.02"


hltPhoton:
  label: "HLT Photon"
  match_dR: 0.1
  eta_ranges:
    inclusive: [0, 7]
    barrel: [0, 1.479]
    endcap: [1.479, 3.0]
  ids:
    # Unseeded e/gamma candidate WITHOUT a GSF track (see header), no ID.
    default:
      label: "HLT Photon (no ID)"
      cuts:
        inclusive:
          - "abs({eta}) < 3.0"

    # HLT_Photon108EB_TightID_TightIso_Unseeded (hltPhoton108EBTightIDTightIso*UnseededFilter),
    # barrel only (hltEG108EtUnseededFilter: EE threshold 9999999):
    #   sigmaIetaIeta < 0.01; H < 0.05 E -> hOverE < 0.05; ecalIso < 2.5 + 0.02 Et;
    #   hcalIso < 3.8 + 0.02 Et (|eta| < 0.8), 6.0 + 0.02 Et (0.8-1.479).
    # All variables are in the nano; approximate only through the e/gamma split (photons with
    # a GSF track are missing) and the noise-cleaned sigmaIetaIeta.
    TightIDTightIso:
      label: "HLT Photon, TightID TightIso EB (approx.)"
      cuts:
        inclusive:
          - "abs({eta}) < 1.479"
          - "{sigmaIetaIeta} < 0.01"
          - "{hOverE} < 0.05"
          - "{ecalIso} < 2.5 + 0.02*{pt}"
          - "(abs({eta}) >= 0.8) | ({hcalIso} < 3.8 + 0.02*{pt})"
          - "(abs({eta}) < 0.8) | ({hcalIso} < 6.0 + 0.02*{pt})"

    # HLT_Diphoton30_23_IsoCaloId_Unseeded (hltDiEG3023IsoCaloId*UnseededFilter), per leg:
    #   sigmaIetaIeta < 0.0113 (EB, EE); H < 0.18 E (EB); ecalIso < 12 + 0.02 Et;
    #   hcalIso < 11 + 0.02 Et (|eta| < 0.8), 12 + 0.02 Et (0.8-1.479 and EE).
    # Not applied (not in nano): EE sigma2vv < 0.64 + 0.0008 Et, sigma2ww < 64 + 0.04 Et,
    #   HGCAL H/E (hForHOverE < 0.125 E), HGCAL iso (< 140 / 370 + 0.05 E).
    IsoCaloId:
      label: "HLT Photon, IsoCaloId (approx.)"
      cuts:
        inclusive:
          - "abs({eta}) < 3.0"
          - "{sigmaIetaIeta} < 0.0113"
          - "{ecalIso} < 12 + 0.02*{pt}"
        barrel:
          - "{hOverE} < 0.18"
          - "(abs({eta}) >= 0.8) | ({hcalIso} < 11 + 0.02*{pt})"
          - "(abs({eta}) < 0.8) | ({hcalIso} < 12 + 0.02*{pt})"
        endcap:
          - "{hcalIso} < 12 + 0.02*{pt}"


hltAK4PuppiJet:
  label: "HLT AK4 PUPPI Jet"
  match_dR: 0.3
  eta_ranges:
    inclusive: [0, 7]
    barrel: [0, 1.5]
    endcap: [1.5, 2.4]
    forwardHGC: [2.4, 3]
    forwardHF: [3, 5]
  ids:
    # NOTE: the nano stores hltAK4PFPuppiJets, i.e. jets WITHOUT the jet energy corrections
    # (HLTrigger/NGTScouting/python/hltJets_cfi.py), while the HLT paths cut on
    # hltAK4PFPuppiJetsCorrected: the nano pt is ~0.78 x gen pt (ttbar), so thresholds on it are
    # not the HLT thresholds: use hltAK4PuppiJetCorr (below). pt > 5 (raw) in the nano.
    # HLT_AK4PFPuppiJet520 (hltSingleAK4PFPuppiJet520) uses |eta| < 5 (= `extended`); the HT and
    # b-tag paths use |eta| < 2.4 (= `default`).
    default:
      label: "HLT AK4 PUPPI Jet (uncorr.)"
      cuts:
        inclusive:
          - "abs({eta}) < 2.4"
    extended:
      label: "HLT AK4 PUPPI Jet (uncorr.), |eta| < 5"
      cuts:
        inclusive:
          - "abs({eta}) < 5"


# hltAK4PuppiJet with the HLT jet energy corrections applied (= hltAK4PFPuppiJetsCorrected, the
# jets the HLT paths cut on), built by menu_tools/caching/make_hlt_jets_corr.py: pt x L2Relative
# of the AK4PFPuppiHLT payload of auto:phase2_realistic_T35 (L1FastJet and L3Absolute are 1),
# tables in configs/V50nano/cache_objects/hlt_jec/. Reproduces HLT_AK4PFPuppiJet520 and
# HLT_PFPuppiHT1070 event by event. Extra fields: rawPt, jecFactor.
hltAK4PuppiJetCorr:
  label: "HLT AK4 PUPPI Jet"
  match_dR: 0.3
  eta_ranges:
    inclusive: [0, 7]
    barrel: [0, 1.5]
    endcap: [1.5, 2.4]
    forwardHGC: [2.4, 3]
    forwardHF: [3, 5]
  ids:
    default:
      label: "HLT AK4 PUPPI Jet"
      cuts:
        inclusive:
          - "abs({eta}) < 2.4"
    extended:
      label: "HLT AK4 PUPPI Jet, |eta| < 5"
      cuts:
        inclusive:
          - "abs({eta}) < 5"
    # b-tag working points (DeepFlavour). The HLT b-tag filters (HLTPFJetTag) of the Phase-2
    # HLT menu (HLT_75e33/modules/hltBTagPFPuppiDeepFlavour*_cfi.py, CMSSW_17_0_0_pre6) cut on
    # JetTags = hltPfDeepFlavourJetTagsModEta2p4:probb, i.e. on prob(b) ALONE (not on
    # b + bb + lepb), of the corrected jets with pT > 30 GeV, |eta| < 2.4
    # (hltPFPuppiJetForBtagSelectorEta2p4). The ids below are the score cut only (with
    # |eta| < 2.4); the btag plots apply the pT cut separately.
    # Caveat: the nano DeepFlavour_prob_* are from hltPfDeepFlavourJetTags (DST_PFScouting /
    # MC_BTV paths), the same model run on the UNcorrected hltAK4PFPuppiJets (tag infos for
    # raw pT > 15 GeV, |eta| < 2.5; other jets get the default-input score), so they are close
    # to, but not exactly, the scores the HLT paths cut on (the jet pT is a tagger input).
    #   HLT_PFHT330PT30_QuadPFPuppiJet_75_60_45_40_TriplePFPuppiBTagDeepFlavour_2p4:
    #     hltBTagPFPuppiDeepFlavour0p275Eta2p4TripleEta2p4 (>= 3 jets with probb > 0.275)
    #   HLT_PFHT200PT30_QuadPFPuppiJet_70_40_30_30_TriplePFPuppiBTagDeepFlavour_2p4:
    #     hltBTagPFPuppiDeepFlavour0p375Eta2p4TripleEta2p4 (>= 3 jets with probb > 0.375)
    #   HLT_DoublePFPuppiJets128_DoublePFPuppiBTagDeepFlavour_2p4:
    #     hltBTagPFPuppiDeepFlavour0p935DoubleEta2p4 (>= 2 jets with probb > 0.935)
    bTagDeepFlavour0p275:
      label: "HLT DeepFlavour prob(b) > 0.275 (TripleBTag HT330)"
      cuts:
        inclusive:
          - "abs({eta}) < 2.4"
          - "{DeepFlavour_prob_b} > 0.275"
    bTagDeepFlavour0p375:
      label: "HLT DeepFlavour prob(b) > 0.375 (TripleBTag HT200)"
      cuts:
        inclusive:
          - "abs({eta}) < 2.4"
          - "{DeepFlavour_prob_b} > 0.375"
    bTagDeepFlavour0p935:
      label: "HLT DeepFlavour prob(b) > 0.935 (DoubleBTag Jets128)"
      cuts:
        inclusive:
          - "abs({eta}) < 2.4"
          - "{DeepFlavour_prob_b} > 0.935"
    # For the comparison with L1 at equal light mis-id: prob(b) cuts at 10% / 1% light-jet
    # mis-identification on ttbar, defined as the L1 bTagLight10 / bTagLight1 WPs
    # (configs/V50nano/objects/jets.yaml; corrected pT > 30 GeV, |eta| < 2.4):
    # > 0.182: light mis-id 10.0%, b eff. 89%; > 0.636: light mis-id 1.0%, b eff. 68%.
    bTagLight10:
      label: "HLT DeepFlavour prob(b) > 0.182 (10% light mis-id)"
      cuts:
        inclusive:
          - "abs({eta}) < 2.4"
          - "{DeepFlavour_prob_b} > 0.182"
    bTagLight1:
      label: "HLT DeepFlavour prob(b) > 0.636 (1% light mis-id)"
      cuts:
        inclusive:
          - "abs({eta}) < 2.4"
          - "{DeepFlavour_prob_b} > 0.636"

hltHpsPFTau:
  label: "HLT HPS PF Tau"
  match_dR: 0.3
  eta_ranges:
    inclusive: [0, 7]
    barrel: [0, 1.5]
    endcap: [1.5, 2.4]
  ids:
    # hltHpsPFTauProducer, unselected (nano: stored only if an L1 tau seed fired). The HLT tau
    # paths (hltHpsSelectedPFTaus*WPDeepTau) cut on pt, |eta| < 2.1 and DeepTau vs jet only (no
    # decay-mode or DeepTau vs e / mu selection), so no decayMode cut is applied here.
    default:
      label: "HLT HPS Tau (L1 tau events), |eta| < 2.1"
      cuts:
        inclusive:
          - "abs({eta}) < 2.1"
    # HLT_DoubleMediumDeepTauPFTauHPS35_eta2p1: hltHpsSelectedPFTausMediumDitauWPDeepTau,
    # deepTauVSjet > wp(pt), wp piecewise linear in pt: 0.649 (pt <= 35), -> 0.441 (pt = 100),
    # -> 0.05 (pt >= 300). Same variable (hltHpsPFTauDeepTauProducer:VSjet) as in the HLT.
    MediumDeepTau:
      label: "HLT HPS Tau (L1 tau events), Medium DeepTau"
      cuts:
        inclusive:
          - "abs({eta}) < 2.1"
          - "({pt} > 35) | ({deepTauVSjet} > 0.649)"
          - "({pt} <= 35) | ({pt} >= 100) | ({deepTauVSjet} > 0.649 + (0.441 - 0.649) / 65 * ({pt} - 35))"
          - "({pt} < 100) | ({pt} >= 300) | ({deepTauVSjet} > 0.441 + (0.05 - 0.441) / 200 * ({pt} - 100))"
          - "({pt} < 300) | ({deepTauVSjet} > 0.05)"
    # Cross-trigger tau leg (HLT_IsoMu20_..._LooseDeepTauPFTauHPS27_eta2p1_CrossL1, Ele30_...):
    # hltHpsSelectedPFTauLooseTauWPDeepTau, wp 0.5419 (pt <= 27) -> 0.4837 (100) -> 0.05 (300).
    LooseDeepTau:
      label: "HLT HPS Tau (L1 tau events), Loose DeepTau"
      cuts:
        inclusive:
          - "abs({eta}) < 2.1"
          - "({pt} > 27) | ({deepTauVSjet} > 0.5419)"
          - "({pt} <= 27) | ({pt} >= 100) | ({deepTauVSjet} > 0.5419 + (0.4837 - 0.5419) / 73 * ({pt} - 27))"
          - "({pt} < 100) | ({pt} >= 300) | ({deepTauVSjet} > 0.4837 + (0.05 - 0.4837) / 200 * ({pt} - 100))"
          - "({pt} < 300) | ({deepTauVSjet} > 0.05)"


# HLT PUPPI HT: the nano's hltPFPuppiHT_pt, one value per event (used like L1puppiMET:default).
# It is the sumEt of hltPFPuppiMHT (HLTHtMhtProducer, HLTrigger/NGTScouting hltSums_cfi):
# JEC-corrected PUPPI jets with pT > 30 GeV and |eta| < 5, summing ET (usePt=False). It is
# therefore NOT the HT that HLT_PFPuppiHT1070 cuts on (hltPFPuppiHT: |eta| < 2.4, pT sum), but
# the only HT from corrected jets in the nano. (hltPFPuppiMET is the type-1 PUPPI sumEt: not used.)
hltPFPuppiHT:
  label: "HLT PUPPI HT (corr. jets, |eta| < 5, ET sum)"
  ids:
    default: {}

# HT / MHT from hltAK4PuppiJet (pt > 30, |eta| < 2.4, as hltPFPuppiHT / PFPuppiMHT of the
# HLT menu), built by menu_tools/caching/make_hlt_sums.py in the L1puppiJetSC4sums layout.
# The nano jets are uncorrected (see hltAK4PuppiJet), so these are ~0.77 x gen. MHT has no
# corrected counterpart in the nano and is taken from here; the HT id is kept for comparison
# with hltPFPuppiHT (~1.4 x this HT in ttbar).
hltPuppiJetSums:
  ids:
    HT:
      label: "HLT PUPPI HT (uncorr. jets)"
      cuts:
        inclusive:
          - "{sumType} == 0"
    MHT:
      label: "HLT PUPPI MHT (uncorr. jets)"
      cuts:
        inclusive:
          - "{sumType} == 1"

# HT / MHT from the corrected jets (hltAK4PuppiJetCorr, menu_tools/caching/make_hlt_jets_corr.py),
# with the definitions of the HLT menu producers:
#   HT  = hltPFPuppiHT  (HLT_PFPuppiHT1070): sum of jet pT, pT > 30, |eta| < 2.4;
#   MHT = hltPFPuppiMHT (HLT_PFPuppiMETTypeOne140_PFPuppiMHT140): |vector sum of jet E_T|,
#         E_T > 30, |eta| < 5.
hltPuppiJetCorrSums:
  ids:
    HT:
      label: "HLT PUPPI HT"
      cuts:
        inclusive:
          - "{sumType} == 0"
    MHT:
      label: "HLT PUPPI MHT"
      cuts:
        inclusive:
          - "{sumType} == 1"
