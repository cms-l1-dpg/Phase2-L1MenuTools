  confidence: high
HLT_DoublePFPuppiJets128_DoublePFPuppiBTagDeepCSV_2p4:
  l1_seeds: [L1_pDoublePuppiJet112_112_final]    # hltL1SeedsForDoublePuppiJetBtagFilter: pDoublePuppiJet112_112
  confidence: high
HLT_DoublePFPuppiJets128_DoublePFPuppiBTagDeepFlavour_2p4:
  l1_seeds: [L1_pDoublePuppiJet112_112_final]    # hltL1SeedsForDoublePuppiJetBtagFilter: pDoublePuppiJet112_112
  confidence: high
HLT_PFHT330PT30_QuadPFPuppiJet_75_60_45_40_TriplePFPuppiBTagDeepFlavour_2p4:
  # hltL1SeedsForQuadPuppiJetTripleBtagFilter: 'pPuppiHT400 and pQuadJet70_55_40_40', which is the
  # single GT algo pPuppiHT400_pQuadJet70_55_40_40 in the emulator output
  l1_seeds: [L1_pPuppiHT400_pQuadJet70_55_40_40_final]
  confidence: high
HLT_PFHT200PT30_QuadPFPuppiJet_70_40_30_30_TriplePFPuppiBTagDeepFlavour_2p4:
  l1_seeds: [L1_pPuppiHT400_pQuadJet70_55_40_40_final]   # as above
  confidence: high

