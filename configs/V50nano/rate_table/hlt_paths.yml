# L1 seed(s) of each HLTX path of the L1+HLT nanos (CMSSW_17_0_0_pre6, HLT:75e33 menu).
# l1_seeds: OR of the listed L1_p*_final bits (P2GT emulator decisions in the `L1` record);
#           ANY = any L1_p*_final bit (L1 accept), used for paths with no L1 requirement.
# Source: the L1 filter of each path in
#   $CMSSW_RELEASE_BASE/src/HLTrigger/Configuration/python/HLT_75e33/{paths,sequences,modules}
# (PathStatusFilter `logicalExpression` or `l1GTAlgoNames` of the L1 / L3 muon filters),
# resolved recursively through the sequences.
# Note: "Unseeded" in the e/gamma path names refers to the e/gamma reconstruction (not L1-region
# seeded); the paths still require the same L1 seed bits as their L1Seeded twins.
# confidence: high   = GT bit(s) read from the path config, and no event with the path fired
#                      without one of its seeds in the dev cache;
#             medium = the path has no GT-bit requirement; the closest bit(s) are given (see note).
# Dev-cache check (V50nano_dev170pre6HLT: MinBias 7520, DYLL_M50 5000, TT 6000, HHTo2B2Tau 1495,
# HHTo4B 3000 = 23015 events; `hlt_paths ... --sample ...`, column n_hlt_not_l1): 0 events with
# the path fired and none of its seeds, for every path (n_hlt from 37 to 3748 per path).
# Not listed: the `_pHLT` copies (old HLT process of the input) and the two DeepCSV quad-jet paths
# HLT_PFHT{330,200}PT30_QuadPFPuppiJet_..._TriplePFPuppiBTagDeepCSV_2p4, which come from the old HLT
# process only (not in the 17_0_0_pre6 menu).
# Used by `hlt_paths` (menu_tools/rate_table/hlt_paths.py).

# --- Jets, HT, MET (PathStatusFilter on the GT algo)
HLT_AK4PFPuppiJet520:
