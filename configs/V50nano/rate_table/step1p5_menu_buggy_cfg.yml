    obj: L1tkElectron:NoIso:inclusive
  leg2:
    threshold_cut: offline_pt >= 15.0
    obj: L1tkElectron:NoIso:inclusive
L1_DoubleTkPhoIso: # TODO see what the equivalent for loose iso is
  cross_masks:
