    - (abs(leg2.eta) < 1.5)
    # - abs(leg2.z0-leg1.z0) < 1
  leg1:
    threshold_cut: offline_pt >= 24.0
    obj: L1tkPhoton:Iso:inclusive
  leg2:
    threshold_cut: offline_pt >= 15.0
    obj: L1tkPhoton:Iso:inclusive
L1_SingleEGEle:
  cross_masks: []
  leg1:
    threshold_cut: offline_pt >= 51.0
    obj: L1EG:default:inclusive
L1_DoubleEGEle:
