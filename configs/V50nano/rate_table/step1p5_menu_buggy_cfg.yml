# Run 3 Pure Muons
L1_SingleTkMu_Barrel:
  cross_masks:
    - (abs(leg1.eta) < 0.83)
  leg1:
    threshold_cut: offline_pt >= 13.0
    obj: L1gmtTkMuon:VLoose:barrel
    # obj: L1MuonKMTF:default # Use specifically KMTF
L1_SingleTkMu:
  cross_masks: []
  leg1:
    threshold_cut: offline_pt >= 25.0
    obj: L1gmtTkMuon:VLoose
L1_DoubleTkMu0er1p4_SQ_OS_dR_Max1p4:
  cross_masks:
    - (abs(leg1.eta) < 1.4)
    - (abs(leg2.eta) < 1.4)
    - ((leg1.deltaR(leg2) < 1.4))
    - ((leg1.charge*leg2.charge < 0.0))
    - ((abs(leg2.z0-leg1.z0) < 1)) # TODO check deltaZ cut
    - ((leg1.deltaR(leg2) > 0))
  leg1:
    threshold_cut: offline_pt >= 1
    obj: L1gmtTkMuon:VLoose
  leg2:
    threshold_cut:  offline_pt >= 1
    obj: L1gmtTkMuon:VLoose
L1_DoubleTkMu4er1p4_SQ_OS_dR_Max1p6:
  cross_masks:
    - (abs(leg1.eta) < 2.0)
    - (abs(leg2.eta) < 2.0)
    - ((leg1.deltaR(leg2) < 1.6) & (leg1.deltaR(leg2) > 0))
    - ((leg1.charge*leg2.charge < 0.0) & (leg1.deltaR(leg2) > 0))
    - ((abs(leg2.z0-leg1.z0) < 1) & (leg1.deltaR(leg2) > 0)) # TODO check deltaZ cut (and whether dR > 0 checks are necessary)
  leg1:
    threshold_cut: offline_pt >= 6
    obj: L1gmtTkMuon:VLoose
  leg2:
    threshold_cut: offline_pt >= 6
    obj: L1gmtTkMuon:VLoose
L1_DoubleTkMu:
  cross_masks:
    - ((abs(leg1.z0-leg2.z0) < 1) & (leg1.deltaR(leg2) > 0)) # TODO check deltaZ cut
  leg1:
    threshold_cut: offline_pt >= 10.0
    obj: L1gmtTkMuon:VLoose
  leg2:
    threshold_cut: offline_pt >= 10.0
    obj: L1gmtTkMuon:VLoose
L1_TripleTkMu:
  cross_masks:
    - abs(leg2.z0-leg1.z0) < 1
    - abs(leg3.z0-leg1.z0) < 1
  leg1:
    threshold_cut: offline_pt >= 5
    obj: L1gmtTkMuon:VLoose
  leg2:
    threshold_cut: offline_pt >= 5
    obj: L1gmtTkMuon:VLoose
  leg3:
    threshold_cut: offline_pt >= 5
    obj: L1gmtTkMuon:VLoose
L1_TripleTkMu_4_2p5_0_OS_Mass_Max12: # Total charge needs to be +/- 1 such that at least one opposite pair is there
  cross_masks:
    - abs(leg2.z0-leg1.z0) < 1
    - abs(leg3.z0-leg1.z0) < 1
    - abs(leg1.charge+leg2.charge+leg3.charge) == 1.0 # TODO check this actually works as expected
    - (leg1+leg2+leg3).mass < 12.0
  leg1:
    threshold_cut: offline_pt >= 6.0
    obj: L1gmtTkMuon:VLoose
  leg2:
    threshold_cut: offline_pt >= 4.0
    obj: L1gmtTkMuon:VLoose
  leg3:
    threshold_cut: offline_pt >= 1.0
    obj: L1gmtTkMuon:VLoose

# Run 3 Pure EG
L1_SingleTkEle:
  cross_masks:
    - (abs(leg1.eta) < 2.5) # NOTE: object itself cut 
  leg1:
    threshold_cut: offline_pt >= 42.0
    obj: L1tkElectron:NoIso:inclusive
L1_SingleTkIsoPhoton:
