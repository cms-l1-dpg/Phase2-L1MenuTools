JetMatchingBarrelSC8:
  sample: TT
  version: V49nano_151pre3_SC8Nano
  match_test_to_ref: True
  reference_object:
    object: "GenJetAK8"
    x_arg: "pt"
    label: "Gen AK8 Jets"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    L1puppiJetSC8:default:barrel: "pt"
    L1puppiJetSC8:mass30:barrel: "pt"
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Matching Efficiency (<threshold> GeV, barrel)"
  binning:
    min: 0
    max: 500
    step: 10

