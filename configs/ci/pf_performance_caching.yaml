V50nano_170:
  Hgg:
    # Each CI variable can name one remote ROOT file, one local ROOT file, or a
    # local/remote filesystem glob.
    ntuple_path: ${PHOTON_NANO_GLOB}
    trees_branches:
      Events:
        GenPart: [pt, eta, phi, pdgId, statusFlags]
        L1EGbarrel: [pt, eta, phi, eleId, saId]
        L1EGendcap: [pt, eta, phi, eleId, saId]
        L1tkPhoton: [pt, eta, phi, phoId, relIso]

  DYLL_M50:
    ntuple_path: ${DY_NANO_GLOB}
    trees_branches:
      Events:
        GenPart: [pt, eta, phi, pdgId, statusFlags]
        L1EGbarrel: [pt, eta, phi, eleId, saId]
        L1EGendcap: [pt, eta, phi, eleId, saId]
        L1tkElectron: [pt, eta, phi, eleId, relIso]
        L1gmtMuon: [pt, eta, phi, hwQual]
        L1gmtTkMuon: [pt, eta, phi, hwQual]

  TT:
    ntuple_path: ${JET_NANO_GLOB}
    trees_branches:
      Events:
        GenJet: [pt, eta, phi]
        GenJetAK8: [pt, eta, phi]
        GenMET: [pt]
        L1puppiJetHisto: [pt, eta, phi]
        L1puppiJetSC4: [pt, eta, phi]
        L1puppiJetSC4NG: [pt, eta, phi]
        L1puppiJetSC8: [pt, eta, phi]
        L1caloJet: [pt, eta, phi]
        L1TrackJet: [pt, eta, phi]
        L1puppiMET: [pt]
        L1puppiMLMET: [pt]
        # Retain phi so the cacher creates the HT/MHT sum-type index.
        L1puppiJetSC4sums: [pt, phi]
        L1puppiHistoJetSums: [pt, phi]
        L1TrackMET: [pt]
        L1TrackHT: [ht, mht]

  VBFHToTauTau:
    ntuple_path: ${TAU_NANO_GLOB}
    trees_branches:
      Events:
        GenVisTau: [pt, eta, phi]
        L1nnPuppiTau: [pt, eta, phi, chargedIso]
        L1hpsTau: [pt, eta, phi]
        L1caloTau: [pt, eta, phi]
        L1nnCaloTau: [pt, eta, phi, hwQual]
