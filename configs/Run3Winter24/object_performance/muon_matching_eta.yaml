MuonsMatching_Eta_pt15toInf:
  sample: TT
  version: Run3Winter24
  match_test_to_ref: True
  reference_object:
    object: "GenPart"
    x_arg: "eta"
    label: "Gen Muon"
    cuts:
      event:
        - "{pt} > 15"
        - "abs({pdgId}) == 13"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    L1Mu:default: "eta"
    L1Mu:pt22: "eta"
  xlabel: "Gen. $\\eta$"
  ylabel: "Matching Efficiency (>15 GeV)"
  binning:
    min: -3
    max: 3
    step: 0.2
