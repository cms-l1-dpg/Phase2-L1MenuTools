JetMatchingBarrel:
  sample: TT
  version: Run3Winter24
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen Jets"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    L1Jet:default: "pt"
    L1Jet:pt25: "pt"
    L1Tau:default: "pt"
    L1Tau:iso: "pt"
    L1Tau:iso34: "pt"
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Trigger Efficiency (<threshold> GeV, barrel)"
  binning:
    min: 0
    max: 500
    step: 10

