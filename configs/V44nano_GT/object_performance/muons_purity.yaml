Purity_Muons_Barrel:
  sample: DYLL_M50
  version: V44nano_GT
  match_test_to_ref: True
  reference_object:
    object: "L1GTgmtTkMuon"
    x_arg: "pt"
    label: "L1GTgmtTkMuon"
    cuts:
      event:
        - "({hwQual}>>0)&1 == 1"
        - "abs({eta}) < 0.83"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    GenPart:muon: "pt"
    L1GTgmtMuon:default: "pt"
    # L1GTtkElectron:NoIso: "pt"
    # L1GTtkElectron:NoIsoNoLowPtID: "pt"
    # L1GTtkElectron:Iso: "pt"
  xlabel: "L1 TkMuon. $p_T$ (GeV)"
  ylabel: "Matching Efficiency (Barrel)"
  binning:
    min: 0
    max: 100
    step: 3

