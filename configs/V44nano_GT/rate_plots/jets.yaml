JetDefaultRates:
  sample: MinBias
  version: V44nano_GT
  test_objects:
    # - L1puppiJetHisto:default
    - L1GTsc4Jet:default
    - L1caloJet:default
    - L1TrackJet:default
  binning:
    min: 40
    max: 420
    step: 20

JetsByRegion:
  sample: MinBias
  version: V44nano_GT
  test_objects:
    - L1GTsc4Jet:default:barrel
    - L1GTsc4Jet:default:endcap
    - L1GTsc4Jet:default:forward
    - L1caloJet:default:barrel
    - L1caloJet:default:endcap
    - L1caloJet:default:forward
    # - L1TrackJet:default:barrel
    # - L1TrackJet:default:endcap
  binning:
    min: 40
    max: 420
    step: 20

JetExtendedRates:
  sample: MinBias
  version: V44nano_GT
  test_objects:
    - L1GTsc4Jet:default:inclusive
    - L1puppiExtJetSC4:default:inclusive
    # - L1puppiExtJetSC4:default:barrel
    # - L1puppiExtJetSC4:default:endcap
    # - L1puppiExtJetSC4:default:forward
  binning:
    min: 40
    max: 420
    step: 20

JetExtendedRatesByRegion:
  sample: MinBias
  version: V44nano_GT
  test_objects:
    # - L1GTsc4Jet:default:barrel
    # - L1GTsc4Jet:default:endcap
    # - L1GTsc4Jet:default:forward
    - L1puppiExtJetSC4:default:barrel
    - L1puppiExtJetSC4:default:endcap
    - L1puppiExtJetSC4:default:forward
  binning:
    min: 40
    max: 420
    step: 20

