JetTurnonBarrel:
  version: V49nano_151pre3_E2ENNVtx
  sample: TT
  match_test_to_ref: True
  reference_object:
    object: "GenJet"
    x_arg: "pt"
    label: "Gen Jets"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.4"
  test_objects:
    # L1puppiJetHisto:default:barrel: "pt"
    L1puppiJetSC4:default:barrel: "pt"
    L1caloJet:default:barrel: "pt"
    L1TrackJet:default:barrel: "pt"
  thresholds: [50, 100]
  scalings:
    method: "naive"
    threshold: 0.95
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Trigger Efficiency (<threshold> GeV, barrel)"
  binning:
    min: 0
    max: 500
    step: 10

